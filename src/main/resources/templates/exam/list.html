<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Danh Sách Đề Thi - ES Platform')}"></head>
<body class="bg-light">
<div id="wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar(${user}, 'exams')}"></div>

    <!-- Page Content -->
    <div id="page-content-wrapper" class="d-flex flex-column">
        <!-- Navbar -->
        <nav th:replace="~{fragments/layout :: navbar(${user})}"></nav>

        <div class="container-fluid my-4 flex-grow-1 px-4">
            <!-- Hộp thông báo chế độ kiểm thử (Mock) -->
            <div class="alert alert-info alert-dismissible fade show border-0 shadow-sm mb-4 d-flex align-items-center justify-content-between" role="alert">
                <div>
                    <i class="fa-solid fa-circle-info me-2 text-info fs-5"></i>
                    <span>Vai trò hiện tại: </span>
                    <strong class="text-primary" th:text="${user.fullName + ' (' + user.role + ')'}">Học viên (STUDENT)</strong>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Thông báo thành công từ RedirectAttributes -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm mb-4" role="alert">
                <i class="fa-solid fa-circle-check me-2 fs-5 text-success"></i> <span th:text="${successMessage}">Thao tác thành công!</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Header Trang danh sách đề thi -->
            <div class="page-header d-flex flex-column flex-sm-row justify-content-between align-items-sm-center">
                <div class="mb-3 mb-sm-0">
                    <h2 class="fw-bold mb-1"><i class="fa-solid fa-file-signature me-2"></i> Kho Đề Thi & Luyện Tập</h2>
                    <p class="text-white-50 mb-0">Hệ thống tổng hợp đề thi thử chuẩn cấu trúc đầy đủ kỹ năng</p>
                </div>
                <!-- Chỉ hiển thị nút "Thêm đề thi mới" đối với vai trò ADMIN -->
                <div th:if="${user.role.name() == 'ADMIN' || user.role == 'ADMIN'}">
                    <a href="/admin/exams/create" class="btn btn-warning btn-lg fw-bold shadow-sm btn-action">
                        <i class="fa-solid fa-plus me-1"></i> Thêm Đề Thi Mới
                    </a>
                </div>
            </div>

            <!-- Grid chứa Danh sách thẻ Card Đề Thi -->
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
                <!-- Khi không có đề thi nào -->
                <div th:if="${exams == null || exams.isEmpty()}" class="col-12 text-center py-5">
                    <div class="card border-0 shadow-sm p-5">
                        <i class="fa-solid fa-folder-open text-muted fs-1 mb-3"></i>
                        <h5 class="text-muted fw-bold">Không tìm thấy đề thi nào</h5>
                    </div>
                </div>

                <!-- Duyệt qua danh sách đề thi -->
                <div th:each="exam : ${exams}" class="col">
                    <div class="card h-100 shadow-sm exam-card">
                        <div class="card-body p-4 d-flex flex-column">
                            <!-- Icon và Loại đề thi -->
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div class="icon-box" th:classappend="${user.role.name() == 'ADMIN' || user.role == 'ADMIN' ? 'icon-box-admin' : 'icon-box-student'}">
                                    <i class="fa-solid fa-file-lines fs-4"></i>
                                </div>
                                <span class="badge rounded-pill bg-info-subtle text-info badge-type px-3 py-2" th:text="${exam.type}">MOCK_TEST</span>
                            </div>

                            <!-- Tên và Mô tả Đề thi -->
                            <h5 class="card-title fw-bold text-dark mb-2" th:text="${exam.title}">Đề thi mẫu</h5>
                            <p class="card-text text-muted flex-grow-1" style="font-size: 0.9rem;" th:text="${exam.description}">Mô tả</p>

                            <!-- Thời gian làm bài -->
                            <div class="d-flex align-items-center mb-3 text-secondary" style="font-size: 0.85rem;">
                                <i class="fa-solid fa-clock me-2 text-primary"></i>
                                <span>Thời gian làm bài: </span>
                                <strong class="ms-1 text-dark" th:text="${exam.duration + ' phút'}">60 phút</strong>
                            </div>

                            <hr class="text-muted my-3 opacity-25">

                            <!-- Phân quyền nút thao tác theo vai trò -->
                            <div class="mt-auto">
                                <!-- STUDENT: Chỉ hiển thị nút "Làm bài" -->
                                <div th:if="${user.role.name() == 'STUDENT' || user.role == 'STUDENT'}">
                                    <a th:href="@{/student/exams/{id}/take(id=${exam.id})}" class="btn btn-primary w-100 fw-bold py-2 btn-action">
                                        <i class="fa-solid fa-pen-to-square me-1"></i> Bắt Đầu Làm Bài
                                    </a>
                                </div>

                                <!-- ADMIN: Chỉ hiển thị nút quản lý "Câu hỏi", "Sửa" và "Xóa" -->
                                <div th:if="${user.role.name() == 'ADMIN' || user.role == 'ADMIN'}" class="d-flex gap-2">
                                    <a th:href="@{/admin/questions(examId=${exam.id})}" class="btn btn-outline-success flex-grow-1 fw-bold btn-sm py-2 btn-action"><i class="fa-solid fa-circle-question"></i> Câu hỏi</a>
                                    <a th:href="@{/admin/exams/{id}/edit(id=${exam.id})}" class="btn btn-outline-primary fw-bold btn-sm py-2 btn-action"><i class="fa-solid fa-pen-to-square"></i> Sửa</a>
                                    <form th:action="@{/admin/exams/{id}/delete(id=${exam.id})}" method="post" class="d-inline" onsubmit="return confirm('Bạn có chắc chắn muốn xóa đề thi này?')">
                                        <button type="submit" class="btn btn-outline-danger fw-bold btn-sm py-2 btn-action"><i class="fa-solid fa-trash"></i> Xóa</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
