<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm tra hộp thư</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth/auth-shared.css}">
    <link rel="stylesheet" th:href="@{/css/auth/register.css}">
</head>

<body class="auth-page">

    <div th:replace="~{fragments/auth-topbar :: authTopBar}"></div>

    <main class="auth-main">
        <div class="auth-card">
            <h1 class="auth-success-title">Kiểm tra hộp thư của bạn!</h1>

            <div class="auth-banner auth-locked-banner" th:if="${rateLimitError != null}">
                <span th:text="${rateLimitError}"></span>
            </div>

            <p class="auth-success-desc" th:if="${email != null}">
                Chúng tôi đã gửi email xác minh đến <strong th:text="${email}"></strong>.<br />
                Nhấp vào liên kết trong email để kích hoạt tài khoản.
            </p>
            <p class="auth-success-desc" th:unless="${email != null}">
                Nếu email vừa đăng ký hợp lệ, chúng tôi đã gửi một liên kết xác minh đến hộp thư của bạn.
            </p>

            <form th:action="@{/verify-email/resend}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="email" th:value="${email}" />
                <button class="btn-resend" type="submit">Không nhận được email? Gửi lại</button>
            </form>

            <a class="auth-redirect" th:href="@{/login}">← Quay lại đăng nhập</a>
        </div>
    </main>

</body>

</html>
