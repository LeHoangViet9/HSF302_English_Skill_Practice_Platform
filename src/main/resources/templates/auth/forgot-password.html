<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth/auth-shared.css}">
    <link rel="stylesheet" th:href="@{/css/auth/forgot-password.css}">
</head>

<body class="auth-page">

    <div th:replace="~{auth/fragments/auth-topbar :: authTopBar}"></div>

    <main class="auth-main">
        <div class="auth-petal auth-petal-1" aria-hidden="true"></div>
        <div class="auth-petal auth-petal-2" aria-hidden="true"></div>
        <div class="auth-petal auth-petal-3" aria-hidden="true"></div>
        <div class="auth-petal auth-petal-4" aria-hidden="true"></div>
        <div class="auth-petal auth-petal-5" aria-hidden="true"></div>
        <div class="auth-petal auth-petal-6" aria-hidden="true"></div>

        <!-- State 2: Đã gửi yêu cầu -->
        <div class="auth-card fp-success-content" th:if="${sent}">
            <svg class="fp-icon-success" width="48" height="48" viewBox="0 0 48 48" aria-hidden="true"
                focusable="false">
                <rect width="48" height="48" rx="24" fill="#E8F5E9"></rect>
                <path d="M14 24l7 7 13-13" stroke="#1AAE39" stroke-width="2.5" stroke-linecap="round"
                    stroke-linejoin="round"></path>
            </svg>
            <h2 class="fp-card-title" tabindex="-1">Kiểm tra email của bạn</h2>
            <p class="fp-card-desc">Nếu email tồn tại, bạn sẽ nhận được link đặt lại mật khẩu trong vài phút.</p>
            <a class="fp-back-link" th:href="@{/forgot-password}">Gửi lại</a>
            <a class="fp-back-link" th:href="@{/login}">Quay lại đăng nhập</a>
        </div>

        <!-- State 1: Form nhập email -->
        <div class="auth-card" th:unless="${sent}">
            <h1 class="auth-title">Quên mật khẩu?</h1>
            <p class="auth-subtitle">Nhập email đã đăng ký, chúng tôi sẽ gửi link đặt lại mật khẩu cho bạn.</p>

            <div class="auth-banner auth-locked-banner" th:if="${rateLimitError != null}">
                <span th:text="${rateLimitError}"></span>
            </div>

            <form class="fp-form" id="forgotPasswordForm" th:action="@{/forgot-password}" method="post"
                th:object="${forgotPasswordForm}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-field">
                    <label for="fp-email">Email</label>
                    <input id="fp-email" th:field="*{email}" type="email" class="form-input"
                        th:classappend="${#fields.hasErrors('email')} ? 'has-error' : ''" th:attr="aria-invalid=${#fields.hasErrors('email')} ? 'true' : 'false',
                                 aria-describedby='fp-email-error'" placeholder="example@email.com"
                        autocomplete="email" autofocus="autofocus" />
                    <span id="fp-email-error" class="field-error" th:if="${#fields.hasErrors('email')}"
                        th:errors="*{email}"></span>
                </div>

                <button class="btn-fp-submit" type="submit">Gửi link đặt lại mật khẩu</button>
            </form>

            <a class="fp-back-link" th:href="@{/login}">Quay lại đăng nhập</a>
        </div>
    </main>

</body>

</html>
