<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth/auth-shared.css}">
    <link rel="stylesheet" th:href="@{/css/auth/register.css}">
</head>

<body class="auth-page">

    <div th:replace="~{auth/fragments/auth-topbar :: authTopBar}"></div>

    <main class="auth-main">
        <div class="auth-petal auth-petal-1" aria-hidden="true"></div>
        <div class="auth-petal auth-petal-2" aria-hidden="true"></div>
        <div class="auth-petal auth-petal-3" aria-hidden="true"></div>
        <div class="auth-petal auth-petal-4" aria-hidden="true"></div>
        <div class="auth-petal auth-petal-5" aria-hidden="true"></div>
        <div class="auth-petal auth-petal-6" aria-hidden="true"></div>

        <div class="auth-card" style="max-width: 480px;">
            <h1 class="auth-title">Tạo tài khoản mới</h1>
            <p class="auth-subtitle">Bắt đầu hành trình học tập của bạn miễn phí</p>

            <form class="register-form" id="registerForm" th:action="@{/register}" method="post"
                th:object="${registerForm}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-field">
                    <label for="fullName">Họ và tên</label>
                    <input id="fullName" th:field="*{fullName}" type="text" class="form-input"
                        th:classappend="${#fields.hasErrors('fullName')} ? 'has-error' : ''"
                        th:attr="aria-invalid=${#fields.hasErrors('fullName')} ? 'true' : 'false'"
                        placeholder="Nguyễn Văn A" autocomplete="name" />
                    <span class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
                </div>

                <div class="form-field">
                    <label for="email">Email</label>
                    <input id="email" th:field="*{email}" type="email" class="form-input"
                        th:classappend="${#fields.hasErrors('email')} ? 'has-error' : ''"
                        th:attr="aria-invalid=${#fields.hasErrors('email')} ? 'true' : 'false'"
                        placeholder="email@example.com" autocomplete="email" />
                    <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>

                <div class="form-field">
                    <label for="password">Mật khẩu</label>
                    <div class="password-input-wrapper">
                        <input id="password" th:field="*{password}" type="password" class="form-input"
                            th:classappend="${#fields.hasErrors('password')} ? 'has-error' : ''"
                            th:attr="aria-invalid=${#fields.hasErrors('password')} ? 'true' : 'false'"
                            placeholder="Tối thiểu 8 ký tự" autocomplete="new-password" />
                        <button type="button" class="password-toggle" data-target="password" aria-label="Hiện mật khẩu">
                            <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                aria-hidden="true" focusable="false">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                aria-hidden="true" focusable="false">
                                <path
                                    d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                                </path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                    <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                    <p class="field-hint" th:unless="${#fields.hasErrors('password')}">
                        Tối thiểu 8 ký tự, bao gồm ít nhất 1 chữ hoa và 1 chữ số
                    </p>
                </div>

                <div class="form-field">
                    <label for="confirmPassword">Xác nhận mật khẩu</label>
                    <div class="password-input-wrapper">
                        <input id="confirmPassword" th:field="*{confirmPassword}" type="password" class="form-input"
                            th:classappend="${#fields.hasErrors('confirmPassword')} ? 'has-error' : ''"
                            th:attr="aria-invalid=${#fields.hasErrors('confirmPassword')} ? 'true' : 'false'"
                            placeholder="Nhập lại mật khẩu" autocomplete="new-password" />
                        <button type="button" class="password-toggle" data-target="confirmPassword"
                            aria-label="Hiện mật khẩu">
                            <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                aria-hidden="true" focusable="false">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                aria-hidden="true" focusable="false">
                                <path
                                    d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                                </path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                    <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}"
                        th:errors="*{confirmPassword}"></span>
                </div>

                <button class="btn-register" type="submit">Tạo tài khoản</button>
            </form>

            <p class="auth-redirect">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p>
        </div>
    </main>

</body>

</html>
