<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác minh email</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth/auth-shared.css}">
    <link rel="stylesheet" th:href="@{/css/auth/register.css}">
</head>

<body class="auth-page">

    <div th:replace="~{fragments/auth-topbar :: authTopBar}"></div>

    <main class="auth-main">
        <div class="auth-card">
            <h1 class="auth-success-title">Liên kết không hợp lệ</h1>
            <p class="auth-success-desc" th:text="${tokenError}">Liên kết xác minh đã hết hạn hoặc không hợp lệ.</p>

            <form class="resend-form" th:action="@{/verify-email/resend}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="form-field">
                    <label for="resendEmail">Email đăng ký</label>
                    <input id="resendEmail" name="email" type="email" class="form-input"
                        placeholder="Nhập email đăng ký của bạn" required="required" />
                </div>
                <button class="btn-register" type="submit">Gửi lại email xác minh</button>
            </form>

            <a class="auth-redirect" th:href="@{/login}">← Về trang đăng nhập</a>
        </div>
    </main>

</body>

</html>
