<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Quản lý nội dung chi tiết - ' + ${lesson.title})}"><title>Quản lý nội dung</title></head>
<body class="apple-theme">
<div id="wrapper">
    <div th:replace="~{fragments/layout :: sidebar(${user}, 'lessons')}"></div>

    <div id="page-content-wrapper" class="d-flex flex-column">
        <nav th:replace="~{fragments/layout :: navbar(${user})}"></nav>

        <div class="container-fluid my-4 flex-grow-1 px-4">
            <div class="page-header d-flex flex-column flex-sm-row justify-content-between align-items-sm-center">
                <div class="mb-3 mb-sm-0">
                    <h2 class="apple-display-lg mb-1">
                        <i class="fa-solid fa-layer-group me-2 text-primary"></i> Quản lý nội dung chi tiết
                    </h2>
                    <p class="apple-lead" style="font-size: 17px; color: var(--apple-body-muted); margin-bottom: 0;">
                        Bài học: <strong class="text-dark" th:text="${lesson.title}"></strong>
                    </p>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/staff/lessons}" class="btn-apple btn-apple-secondary-pill btn-action" style="font-size: 14px; padding: 10px 20px; text-decoration: none; display: inline-flex; align-items: center;">
                        <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
                    </a>
                    <a th:href="@{/staff/lessons/{id}/contents/create(id=${lesson.id})}" class="btn-apple btn-apple-primary btn-action" style="font-size: 14px; padding: 10px 20px; text-decoration: none; display: inline-flex; align-items: center;">
                        <i class="fa-solid fa-plus me-1"></i> Thêm nội dung mới
                    </a>
                </div>
            </div>

            <div class="apple-store-utility-card p-4">
                <div class="table-responsive">
                    <table class="table table-borderless align-middle m-0" style="font-family: var(--apple-font-text), sans-serif;">
                        <thead>
                            <tr style="border-bottom: 1px solid var(--apple-hairline); color: var(--apple-ink-muted-80);">
                                <th class="pb-3" style="font-size: 14px; font-weight: 600; width: 80px;">Thứ tự</th>
                                <th class="pb-3" style="font-size: 14px; font-weight: 600; min-width: 150px;">Nội dung / Cấu trúc</th>
                                <th class="pb-3" style="font-size: 14px; font-weight: 600; min-width: 120px;">Phiên âm (IPA)</th>
                                <th class="pb-3" style="font-size: 14px; font-weight: 600; min-width: 150px;">Nghĩa</th>
                                <th class="pb-3" style="font-size: 14px; font-weight: 600; min-width: 180px;">Giải thích</th>
                                <th class="pb-3" style="font-size: 14px; font-weight: 600; min-width: 180px;">Ví dụ</th>
                                <th class="pb-3 text-center" style="font-size: 14px; font-weight: 600; width: 150px;">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${contents == null || contents.isEmpty()}">
                                <td colspan="7" class="text-center py-5 text-muted">Chưa có nội dung chi tiết nào cho bài học này. Hãy nhấn nút thêm mới phía trên.</td>
                            </tr>
                            <tr th:each="c : ${contents}" style="border-bottom: 1px solid var(--apple-divider-soft);">
                                <td class="py-3 fw-bold" th:text="${c.contentOrder}"></td>
                                <td class="py-3 fw-semibold text-dark" th:text="${c.wordOrStructure}"></td>
                                <td class="py-3">
                                    <span class="text-primary font-monospace" th:if="${c.ipa != null && !c.ipa.isBlank()}" th:text="${c.ipa}"></span>
                                    <span class="text-muted" th:if="${c.ipa == null || c.ipa.isBlank()}">-</span>
                                </td>
                                <td class="py-3" th:text="${c.meaning}"></td>
                                <td class="py-3 text-truncate" style="max-width: 250px;" th:text="${c.explanation}" th:title="${c.explanation}"></td>
                                <td class="py-3 text-truncate" style="max-width: 250px;" th:text="${c.example}" th:title="${c.example}"></td>
                                <td class="py-3 text-center">
                                    <div class="d-flex justify-content-center gap-2">
                                        <a class="btn-apple btn-apple-pearl-capsule btn-action" style="padding: 6px 12px; font-size: 13px; text-decoration: none;"
                                           th:href="@{/staff/lessons/{lessonId}/contents/edit/{contentId}(lessonId=${lesson.id}, contentId=${c.id})}">
                                            Sửa
                                        </a>
                                        <a class="btn-apple btn-apple-dark-utility btn-action" style="padding: 6px 12px; font-size: 13px; text-decoration: none;"
                                           th:href="@{/staff/lessons/{lessonId}/contents/delete/{contentId}(lessonId=${lesson.id}, contentId=${c.id})}"
                                           onclick="confirmAction(event, this, 'Bạn có chắc chắn muốn xóa nội dung này?', 'Xóa');">
                                            Xóa
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
