<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head th:replace="~{fragments/layout :: head('Quản lý Bài học')}">
    <title>Quản lý Bài học</title>
</head>

<body class="apple-theme">
    <div id="wrapper">
        <!-- Sidebar -->
        <div th:replace="~{fragments/layout :: sidebar(${user}, 'lessons')}"></div>

        <!-- Page Content -->
        <div id="page-content-wrapper" class="d-flex flex-column">
            <!-- Navbar -->
            <nav th:replace="~{fragments/layout :: navbar(${user})}"></nav>

            <div class="container-fluid my-4 flex-grow-1 px-4">
                <!-- Header Quản lý Bài học -->
                <div class="page-header d-flex flex-column flex-sm-row justify-content-between align-items-sm-center">
                    <div class="mb-3 mb-sm-0">
                        <h2 class="apple-display-lg mb-1"><i class="fa-solid fa-book me-2 text-primary"></i> Quản Lý Bài
                            Học</h2>
                        <p class="apple-lead"
                            style="font-size: 17px; color: var(--apple-body-muted); margin-bottom: 0;">Danh sách bài học
                            và tài liệu lý thuyết trong hệ thống</p>
                    </div>
                    <div>
                        <a th:href="@{/manage/lessons/create}" class="btn-apple btn-apple-primary btn-action"
                            style="font-size: 14px; padding: 10px 20px;">
                            <i class="fa-solid fa-plus me-1"></i> Thêm Bài Học Mới
                        </a>
                    </div>
                </div>

                <!-- Form tìm kiếm bộ lọc -->
                <div class="apple-store-utility-card p-3 mb-4" style="height: auto;">
                    <form class="row g-3" method="get" th:action="@{/manage/lessons}">
                        <div class="col-md-4">
                            <input class="apple-text-field" style="height: 40px; padding: 8px 16px; font-size: 15px;"
                                type="text" name="keyword" aria-label="Tìm kiếm tiêu đề bài học"
                                placeholder="Tìm kiếm tiêu đề bài học..." th:value="${keyword}">
                        </div>

                        <div class="col-md-3">
                            <select class="apple-text-field" style="height: 40px; padding: 0 16px; font-size: 15px;"
                                name="type" aria-label="Lọc theo Loại">
                                <option value="">Tất cả các Loại</option>
                                <option th:each="t : ${types}" th:value="${t}" th:text="${t}"
                                    th:selected="${selectedType == t}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <select class="apple-text-field" style="height: 40px; padding: 0 16px; font-size: 15px;"
                                name="level" aria-label="Lọc theo Cấp độ">
                                <option value="">Tất cả Cấp độ</option>
                                <option th:each="l : ${levels}" th:value="${l}" th:text="${l}"
                                    th:selected="${selectedLevel == l}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-2">
                            <button class="btn-apple btn-apple-primary w-100 btn-action"
                                style="height: 40px; font-size: 14px;" type="submit">
                                Tìm kiếm
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Bảng Danh sách bài học -->
                <div class="apple-store-utility-card p-4">
                    <div class="table-responsive">
                        <table class="table table-borderless align-middle m-0"
                            style="font-family: var(--apple-font-text), sans-serif;">
                            <thead>
                                <tr
                                    style="border-bottom: 1px solid var(--apple-hairline); color: var(--apple-ink-muted-80);">
                                    <th class="pb-3" style="font-size: 14px; font-weight: 600;">ID</th>
                                    <th class="pb-3" style="font-size: 14px; font-weight: 600;">Tiêu đề</th>
                                    <th class="pb-3" style="font-size: 14px; font-weight: 600;">Loại</th>
                                    <th class="pb-3" style="font-size: 14px; font-weight: 600;">Cấp độ</th>
                                    <th class="pb-3" style="font-size: 14px; font-weight: 600;">Trạng thái</th>
                                    <th class="pb-3" style="font-size: 14px; font-weight: 600;">Mô tả</th>
                                    <th class="pb-3 text-center" style="font-size: 14px; font-weight: 600;">Hành động
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${lessonPage == null || lessonPage.isEmpty()}">
                                    <td colspan="6" class="text-center py-5 text-muted">Chưa có bài học nào được tạo.
                                    </td>
                                </tr>
                                <tr th:each="lesson : ${lessonPage}"
                                    style="border-bottom: 1px solid var(--apple-divider-soft);">
                                    <td class="py-3 fw-bold" th:text="${lesson.id}"></td>
                                    <td class="py-3 fw-semibold text-dark" th:text="${lesson.title}"></td>
                                    <td class="py-3"><span class="badge bg-light text-dark border px-2 py-1"
                                            th:text="${lesson.type}"></span></td>
                                    <td class="py-3"><span class="badge bg-light text-dark border px-2 py-1"
                                            th:text="${lesson.level}"></span></td>
                                    <td class="py-3">
                                        <span class="badge bg-warning text-dark"
                                            th:if="${lesson.approvalStatus != null and lesson.approvalStatus.name() == 'PENDING'}">Chờ
                                            duyệt</span>
                                        <span class="badge bg-success"
                                            th:if="${lesson.approvalStatus != null and lesson.approvalStatus.name() == 'APPROVED'}">Đã
                                            duyệt</span>

                                        <!-- hiện thị nút chôit -->
                                        <span
                                            th:if="${lesson.approvalStatus != null and lesson.approvalStatus.name() == 'REJECTED'}">
                                            <button type="button" class="badge bg-danger border-0"
                                                style="cursor: pointer;" data-bs-toggle="collapse"
                                                th:data-bs-target="'#lessonRejectReason-' + ${lesson.id}"
                                                th:aria-controls="'lessonRejectReason-' + ${lesson.id}"
                                                aria-expanded="false">
                                                Từ chối
                                            </button>
                                        </span>


                                        <!-- Nội dung lý do từ chối -->
                                    <td class="py-3" style="max-width: 250px;">
                                        <div class="text-truncate" th:text="${lesson.description}">
                                            Mô tả bài học
                                        </div>

                                        <div class="collapse" th:id="'lessonRejectReason-' + ${lesson.id}">
                                            <div class="alert alert-danger py-2 px-3 mt-2 mb-0">
                                                <div class="fw-bold mb-1">
                                                    <i class="fa-solid fa-circle-exclamation me-1"></i>
                                                    Lý do từ chối
                                                </div>

                                                <span th:text="${lesson.rejectReason != null and !lesson.rejectReason.isBlank()
                                                        ? lesson.rejectReason
                                                        : 'Admin không cung cấp lý do.'}">
                                                </span>
                                            </div>
                                        </div>
                                    </td>


                                    <td class="py-3 text-center">
                                        <div class="d-flex justify-content-center gap-2">
                                            <a class="btn-apple btn-apple-pearl-capsule btn-action"
                                                style="padding: 6px 12px; font-size: 13px;"
                                                th:href="@{/manage/lessons/edit/{id}(id=${lesson.id})}">
                                                Sửa
                                            </a>
                                            <a class="btn-apple btn-apple-dark-utility btn-action"
                                                style="padding: 6px 12px; font-size: 13px;"
                                                th:href="@{/manage/lessons/delete/{id}(id=${lesson.id})}"
                                                onclick="confirmAction(event, this, 'Bạn có chắc chắn muốn xóa bài học này?', 'Xóa');">
                                                Xóa
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div th:replace="~{fragments/pagination :: pagination(page=${lessonPage}, entityName='bài học')}">
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <footer th:replace="~{fragments/layout :: footer}"></footer>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>
