<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Thông tin Bài học')}"></head>
<body class="apple-theme">
<div id="wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar(${user}, 'lessons')}"></div>

    <!-- Page Content -->
    <div id="page-content-wrapper" class="d-flex flex-column">
        <!-- Navbar -->
        <nav th:replace="~{fragments/layout :: navbar(${user})}"></nav>

        <div class="container-fluid my-4 flex-grow-1 px-4">
            <div class="row g-4 justify-content-center">
                <!-- Left Column: Lesson Form -->
                <div th:class="${lesson.id != null} ? 'col-lg-5 col-12' : 'col-md-8 col-lg-6 col-12'" style="max-width: 600px;">
                    <div class="apple-store-utility-card p-4" style="height: fit-content;">
                        <!-- Form Header -->
                        <div style="border-bottom: 1px solid var(--apple-hairline); padding-bottom: 16px; margin-bottom: 24px;">
                            <h4 class="apple-tagline mb-0" style="font-size: 21px; display: flex; align-items: center; gap: 8px;">
                                <i class="fa-solid fa-book-open text-primary"></i> Thông Tin Bài Học
                            </h4>
                        </div>

                        <!-- Form -->
                        <form method="post" th:action="@{/staff/lessons/save}" th:object="${lesson}">
                            <input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label class="apple-caption-strong" style="color: var(--apple-ink); margin-bottom: 6px; display: block;">
                                    Tiêu đề bài học <span class="text-danger">*</span>
                                </label>
                                <input class="apple-text-field" type="text" th:field="*{title}" placeholder="Nhập tiêu đề bài học..." required>
                            </div>

                            <div class="mb-3">
                                <label class="apple-caption-strong" style="color: var(--apple-ink); margin-bottom: 6px; display: block;">
                                    Loại bài học <span class="text-danger">*</span>
                                </label>
                                <select class="apple-text-field" style="height: 48px; padding: 0 16px; font-size: 15px;" th:field="*{type}" required>
                                    <option value="">Chọn loại bài học...</option>
                                    <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="apple-caption-strong" style="color: var(--apple-ink); margin-bottom: 6px; display: block;">
                                    Cấp độ bài học <span class="text-danger">*</span>
                                </label>
                                <select class="apple-text-field" style="height: 48px; padding: 0 16px; font-size: 15px;" th:field="*{level}" required>
                                    <option value="">Chọn cấp độ...</option>
                                    <option th:each="l : ${levels}" th:value="${l}" th:text="${l}"></option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="apple-caption-strong" style="color: var(--apple-ink); margin-bottom: 6px; display: block;">
                                    Mô tả ngắn
                                </label>
                                <textarea class="apple-text-field" rows="4" style="height: auto;" th:field="*{description}" placeholder="Nhập mô tả tóm tắt nội dung bài học..."></textarea>
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/staff/lessons}" class="btn-apple btn-apple-secondary-pill" style="font-size: 14px; padding: 10px 20px; text-decoration: none;">Quay lại</a>
                                <button class="btn-apple btn-apple-primary btn-action" style="font-size: 14px; padding: 10px 20px;" type="submit">
                                    Lưu thông tin
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Right Column: Flashcard List -->
                <div th:if="${lesson.id != null}" class="col-lg-7 col-12">
                    <div class="apple-store-utility-card p-4" style="height: fit-content;">
                        <!-- Header -->
                        <div class="d-flex justify-content-between align-items-center mb-3 pb-3" style="border-bottom: 1px solid var(--apple-hairline);">
                            <h4 class="apple-tagline mb-0" style="font-size: 21px; display: flex; align-items: center; gap: 8px;">
                                <i class="fa-solid fa-layer-group text-primary"></i> Nội dung chi tiết
                            </h4>
                            <a th:href="@{/staff/lessons/{id}/contents/create(id=${lesson.id})}" class="btn-apple btn-apple-primary btn-action" style="font-size: 13px; padding: 6px 12px; text-decoration: none; display: inline-flex; align-items: center;">
                                <i class="fa-solid fa-plus me-1"></i> Thêm nội dung mới
                            </a>
                        </div>

                        <!-- Table -->
                        <div class="table-responsive">
                            <table class="table table-borderless align-middle m-0" style="font-family: var(--apple-font-text); font-size: 14px;">
                                <thead>
                                    <tr style="border-bottom: 1px solid var(--apple-hairline); color: var(--apple-ink-muted-80);">
                                        <th class="pb-2" style="font-weight: 600; width: 50px;">Stt</th>
                                        <th class="pb-2" style="font-weight: 600;">Nội dung / Cấu trúc</th>
                                        <th class="pb-2" style="font-weight: 600;">Nghĩa</th>
                                        <th class="pb-2 text-center" style="font-weight: 600; width: 120px;">Hành động</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${contents == null || contents.isEmpty()}">
                                        <td colspan="4" class="text-center py-4 text-muted">Chưa có nội dung chi tiết nào. Hãy nhấn nút thêm nội dung mới.</td>
                                    </tr>
                                    <tr th:each="c : ${contents}" style="border-bottom: 1px solid var(--apple-divider-soft);">
                                        <td class="py-2 fw-bold" th:text="${c.contentOrder}"></td>
                                        <td class="py-2 fw-semibold text-dark">
                                            <span th:text="${c.wordOrStructure}"></span>
                                            <div class="apple-caption text-primary" style="font-size: 11px;" th:if="${c.ipa != null && !c.ipa.isBlank()}" th:text="${c.ipa}"></div>
                                        </td>
                                        <td class="py-2" th:text="${c.meaning}"></td>
                                        <td class="py-2 text-center">
                                            <div class="d-flex justify-content-center gap-2">
                                                <a class="btn-apple btn-apple-pearl-capsule btn-action" style="padding: 4px 8px; font-size: 12px; text-decoration: none;"
                                                   th:href="@{/staff/lessons/{lessonId}/contents/edit/{contentId}(lessonId=${lesson.id}, contentId=${c.id})}">
                                                    Sửa
                                                </a>
                                                <a class="btn-apple btn-apple-dark-utility btn-action" style="padding: 4px 8px; font-size: 12px; text-decoration: none;"
                                                   th:href="@{/staff/lessons/{lessonId}/contents/delete/{contentId}(lessonId=${lesson.id}, contentId=${c.id})}"
                                                   onclick="return confirm('Bạn có chắc chắn muốn xóa flashcard này?')">
                                                    Xóa
                                                </a>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
