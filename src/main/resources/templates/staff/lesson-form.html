<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Thông tin Bài học')}"></head>
<body class="apple-theme">
<div id="wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar(${user}, 'lessons')}"></div>

    <!-- Page Content -->
    <div id="page-content-wrapper" class="d-flex flex-column">
        <!-- Navbar -->
        <nav th:replace="~{fragments/layout :: navbar(${user})}"></nav>

        <div class="container-fluid my-4 flex-grow-1 px-4">
            <div class="apple-store-utility-card p-4 mx-auto" style="max-width: 760px; width: 100%; height: fit-content;">
                <!-- Form Header -->
                <div style="border-bottom: 1px solid var(--apple-hairline); padding-bottom: 16px; margin-bottom: 24px;">
                    <h4 class="apple-tagline mb-0" style="font-size: 21px; display: flex; align-items: center; gap: 8px;">
                        <i class="fa-solid fa-book-open text-primary"></i> Thông Tin Bài Học
                    </h4>
                </div>

                <!-- Form -->
                <form method="post" th:action="@{/staff/lessons/save}" th:object="${lesson}">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="apple-caption-strong" style="color: var(--apple-ink); margin-bottom: 6px; display: block;">
                            Tiêu đề bài học <span class="text-danger">*</span>
                        </label>
                        <input class="apple-text-field" type="text" th:field="*{title}" placeholder="Nhập tiêu đề bài học..." required>
                    </div>

                    <div class="mb-3">
                        <label class="apple-caption-strong" style="color: var(--apple-ink); margin-bottom: 6px; display: block;">
                            Loại bài học <span class="text-danger">*</span>
                        </label>
                        <select class="apple-text-field" style="height: 48px; padding: 0 16px; font-size: 15px;" th:field="*{type}" required>
                            <option value="">Chọn loại bài học...</option>
                            <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="apple-caption-strong" style="color: var(--apple-ink); margin-bottom: 6px; display: block;">
                            Cấp độ bài học <span class="text-danger">*</span>
                        </label>
                        <select class="apple-text-field" style="height: 48px; padding: 0 16px; font-size: 15px;" th:field="*{level}" required>
                            <option value="">Chọn cấp độ...</option>
                            <option th:each="l : ${levels}" th:value="${l}" th:text="${l}"></option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="apple-caption-strong" style="color: var(--apple-ink); margin-bottom: 6px; display: block;">
                            Mô tả ngắn
                        </label>
                        <textarea class="apple-text-field" rows="4" style="height: auto;" th:field="*{description}" placeholder="Nhập mô tả tóm tắt nội dung bài học..."></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/staff/lessons}" class="btn-apple btn-apple-secondary-pill" style="font-size: 14px; padding: 10px 20px;">Quay lại</a>
                        <button class="btn-apple btn-apple-primary btn-action" style="font-size: 14px; padding: 10px 20px;" type="submit">
                            Lưu thông tin
                        </button>
                    </div>
                </form>
            </div>

            <div class="apple-store-utility-card p-4 mx-auto mt-4" th:if="${lesson.id != null}" style="max-width: 980px; width: 100%; height: fit-content;">
                <div class="d-flex flex-column flex-lg-row justify-content-between gap-3" style="border-bottom: 1px solid var(--apple-hairline); padding-bottom: 16px; margin-bottom: 24px;">
                    <div>
                        <h4 class="apple-tagline mb-1" style="font-size: 21px;">
                            <i class="fa-solid fa-list-check text-primary me-2"></i> Nội dung chi tiết
                        </h4>
                        <p class="apple-caption mb-0" style="color: var(--apple-ink-muted-80);">
                            Nhập từ vựng, cấu trúc ngữ pháp, IPA, nghĩa và ví dụ cho bài học.
                        </p>
                    </div>
                    <a class="btn-apple btn-apple-secondary-pill btn-action align-self-start"
                       th:href="@{/staff/lessons/edit/{id}(id=${lesson.id})}"
                       style="font-size: 14px; padding: 9px 16px;">
                        <i class="fa-solid fa-plus me-1"></i> Tạo nội dung mới
                    </a>
                </div>

                <form method="post"
                      th:action="@{/staff/lessons/{lessonId}/contents/save(lessonId=${lesson.id})}"
                      th:object="${lessonContent}"
                      class="row g-3 mb-4">
                    <input type="hidden" th:field="*{id}">

                    <div class="col-md-6">
                        <label class="apple-caption-strong mb-1 d-block">Từ vựng / Cấu trúc <span class="text-danger">*</span></label>
                        <input class="apple-text-field" type="text" th:field="*{wordOrStructure}" placeholder="VD: present perfect / environment" required>
                    </div>

                    <div class="col-md-3">
                        <label class="apple-caption-strong mb-1 d-block">IPA</label>
                        <input class="apple-text-field" type="text" th:field="*{ipa}" placeholder="/in'vai?r?nment/">
                    </div>

                    <div class="col-md-3">
                        <label class="apple-caption-strong mb-1 d-block">Thứ tự</label>
                        <input class="apple-text-field" type="number" th:field="*{contentOrder}" min="1" placeholder="1">
                    </div>

                    <div class="col-md-6">
                        <label class="apple-caption-strong mb-1 d-block">Nghĩa / Ghi chú ngắn</label>
                        <input class="apple-text-field" type="text" th:field="*{meaning}" placeholder="Nghĩa tiếng Việt hoặc mô tả ngắn">
                    </div>

                    <div class="col-md-6">
                        <label class="apple-caption-strong mb-1 d-block">Ví dụ</label>
                        <input class="apple-text-field" type="text" th:field="*{example}" placeholder="Đặt câu mẫu cho học viên">
                    </div>

                    <div class="col-12">
                        <label class="apple-caption-strong mb-1 d-block">Giải thích chi tiết</label>
                        <textarea class="apple-text-field" rows="3" style="height: auto;" th:field="*{explanation}" placeholder="Giải thích cách dùng, dấu hiệu nhận biết, lưu ý..."></textarea>
                    </div>

                    <div class="col-12 d-flex justify-content-end">
                        <button class="btn-apple btn-apple-primary btn-action" style="font-size: 14px; padding: 10px 20px;" type="submit">
                            Lưu nội dung
                        </button>
                    </div>
                </form>

                <div class="table-responsive">
                    <table class="table table-borderless align-middle m-0" style="font-family: var(--apple-font-text);">
                        <thead>
                        <tr style="border-bottom: 1px solid var(--apple-hairline); color: var(--apple-ink-muted-80);">
                            <th class="pb-3" style="font-size: 14px; font-weight: 600;">Thứ tự</th>
                            <th class="pb-3" style="font-size: 14px; font-weight: 600;">Từ / Cấu trúc</th>
                            <th class="pb-3" style="font-size: 14px; font-weight: 600;">IPA</th>
                            <th class="pb-3" style="font-size: 14px; font-weight: 600;">Nghĩa</th>
                            <th class="pb-3 text-center" style="font-size: 14px; font-weight: 600;">Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${contents == null || contents.isEmpty()}">
                            <td colspan="5" class="text-center py-4 text-muted">Chưa có nội dung chi tiết cho bài học này.</td>
                        </tr>
                        <tr th:each="content : ${contents}" style="border-bottom: 1px solid var(--apple-divider-soft);">
                            <td class="py-3" th:text="${content.contentOrder}">1</td>
                            <td class="py-3 fw-semibold text-dark" th:text="${content.wordOrStructure}">word</td>
                            <td class="py-3 text-muted" th:text="${content.ipa}">/w3:d/</td>
                            <td class="py-3 text-truncate" style="max-width: 260px;" th:text="${content.meaning}">meaning</td>
                            <td class="py-3 text-center">
                                <div class="d-flex justify-content-center gap-2">
                                    <a class="btn-apple btn-apple-pearl-capsule btn-action"
                                       style="padding: 6px 12px; font-size: 13px;"
                                       th:href="@{/staff/lessons/{lessonId}/contents/edit/{contentId}(lessonId=${lesson.id}, contentId=${content.id})}">
                                        Sửa
                                    </a>
                                    <a class="btn-apple btn-apple-dark-utility btn-action"
                                       style="padding: 6px 12px; font-size: 13px;"
                                       th:href="@{/staff/lessons/{lessonId}/contents/delete/{contentId}(lessonId=${lesson.id}, contentId=${content.id})}"
                                       onclick="return confirm('Xóa nội dung này?')">
                                        Xóa
                                    </a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
