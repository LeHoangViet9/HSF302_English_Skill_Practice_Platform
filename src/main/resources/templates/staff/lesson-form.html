<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lesson Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2 class="mb-3">Lesson Form</h2>

    <form method="post"
          th:action="@{/staff/lessons/save}"
          th:object="${lesson}">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Title</label>

            <input class="form-control"
                   type="text"
                   th:field="*{title}"
                   placeholder="Enter lesson title"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Type</label>

            <select class="form-select" th:field="*{type}" required>
                <option value="">Choose type</option>

                <option th:each="t : ${types}"
                        th:value="${t}"
                        th:text="${t}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Level</label>

            <select class="form-select" th:field="*{level}" required>
                <option value="">Choose level</option>

                <option th:each="l : ${levels}"
                        th:value="${l}"
                        th:text="${l}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>

            <textarea class="form-control"
                      rows="4"
                      th:field="*{description}"
                      placeholder="Enter lesson description"></textarea>
        </div>

        <button class="btn btn-primary" type="submit">
            Save
        </button>

        <a class="btn btn-secondary" th:href="@{/staff/lessons}">
            Back
        </a>

    </form>

</div>

</body>
</html>
