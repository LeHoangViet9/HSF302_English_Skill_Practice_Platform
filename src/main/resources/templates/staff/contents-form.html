<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Thông tin nội dung chi tiết')}"></head>
<body class="apple-theme">
<div id="wrapper">
    <div th:replace="~{fragments/layout :: sidebar(${user}, 'lessons')}"></div>

    <div id="page-content-wrapper" class="d-flex flex-column">
        <nav th:replace="~{fragments/layout :: navbar(${user})}"></nav>

        <div class="container-fluid my-4 flex-grow-1 px-4 d-flex justify-content-center">
            <div class="apple-store-utility-card p-4" style="max-width: 600px; width: 100%; height: fit-content;">
                <div style="border-bottom: 1px solid var(--apple-hairline); padding-bottom: 16px; margin-bottom: 24px;">
                    <h4 class="apple-tagline mb-0" style="font-size: 21px; display: flex; align-items: center; gap: 8px;">
                        <i class="fa-solid fa-layer-group text-primary"></i> Thông tin nội dung chi tiết
                    </h4>
                    <p class="text-muted small mt-1 mb-0" th:text="'Bài học: ' + ${lesson.title}"></p>
                </div>

                <form method="post" th:action="@{/staff/lessons/{lessonId}/contents/save(lessonId=${lesson.id})}" th:object="${content}">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="apple-caption-strong" style="color: var(--apple-ink); margin-bottom: 6px; display: block;">
                            Nội dung / Cấu trúc <span class="text-danger">*</span>
                        </label>
                        <input class="apple-text-field" type="text" th:field="*{wordOrStructure}" placeholder="Nhập nội dung, từ vựng hoặc cấu trúc..." required>
                    </div>

                    <div class="mb-3">
                        <label class="apple-caption-strong" style="color: var(--apple-ink); margin-bottom: 6px; display: block;">
                            Phiên âm (IPA)
                        </label>
                        <input class="apple-text-field" type="text" th:field="*{ipa}" placeholder="Ví dụ: /əˈbaʊt/...">
                    </div>

                    <div class="mb-3">
                        <label class="apple-caption-strong" style="color: var(--apple-ink); margin-bottom: 6px; display: block;">
                            Nghĩa / Ghi chú ngắn <span class="text-danger">*</span>
                        </label>
                        <input class="apple-text-field" type="text" th:field="*{meaning}" placeholder="Nhập nghĩa hoặc mô tả ngắn..." required>
                    </div>

                    <div class="mb-3">
                        <label class="apple-caption-strong" style="color: var(--apple-ink); margin-bottom: 6px; display: block;">
                            Thứ tự hiển thị <span class="text-danger">*</span>
                        </label>
                        <input class="apple-text-field" type="number" th:field="*{contentOrder}" placeholder="Ví dụ: 1, 2, 3..." required>
                    </div>

                    <div class="mb-3">
                        <label class="apple-caption-strong" style="color: var(--apple-ink); margin-bottom: 6px; display: block;">
                            Giải thích chi tiết
                        </label>
                        <textarea class="apple-text-field" rows="3" style="height: auto;" th:field="*{explanation}" placeholder="Nhập giải thích cách dùng, dấu hiệu nhận biết, lưu ý..."></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="apple-caption-strong" style="color: var(--apple-ink); margin-bottom: 6px; display: block;">
                            Ví dụ minh họa
                        </label>
                        <textarea class="apple-text-field" rows="3" style="height: auto;" th:field="*{example}" placeholder="Nhập ví dụ minh họa cho người học..."></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/staff/lessons/edit/{lessonId}(lessonId=${lesson.id})}" class="btn-apple btn-apple-secondary-pill" style="font-size: 14px; padding: 10px 20px; text-decoration: none;">Quay lại</a>
                        <button class="btn-apple btn-apple-primary btn-action" style="font-size: 14px; padding: 10px 20px;" type="submit">
                            Lưu thông tin
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
