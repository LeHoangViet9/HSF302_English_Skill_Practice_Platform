<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Từ đã lưu')}"></head>
<body class="apple-theme">
<div id="wrapper">
    <div th:replace="~{fragments/layout :: sidebar(${user}, 'bookmarks')}"></div>

    <div id="page-content-wrapper" class="d-flex flex-column">
        <nav th:replace="~{fragments/layout :: navbar(${user})}"></nav>

        <div class="container-fluid my-4 flex-grow-1 px-4">
            <div class="page-header d-flex flex-column flex-lg-row justify-content-between align-items-lg-center">
                <div class="mb-3 mb-lg-0">
                    <h2 class="apple-display-lg mb-1">
                        <i class="fa-solid fa-bookmark me-2 text-primary"></i> Từ vựng đã lưu
                    </h2>
                    <p class="apple-lead" style="font-size: 17px; color: var(--apple-body-muted); margin-bottom: 0;">
                        Danh sách từ và cấu trúc yêu thích của bạn
                    </p>
                </div>
                <a class="btn-apple btn-apple-primary btn-action" th:href="@{/student/dictionary}">
                    <i class="fa-solid fa-magnifying-glass me-1"></i> Tra cứu thêm
                </a>
            </div>

            <div class="row g-4">
                <div class="col-12" th:if="${bookmarks == null || bookmarks.isEmpty()}">
                    <div class="apple-store-utility-card p-5 text-center" style="height: auto;">
                        <p class="text-muted mb-0">Bạn chưa lưu từ vựng nào.</p>
                    </div>
                </div>

                <div class="col-md-6 col-xl-4" th:each="bookmark : ${bookmarks}">
                    <div class="apple-store-utility-card p-4 h-100" style="height: auto;">
                        <div class="d-flex justify-content-between gap-3 mb-3">
                            <div>
                                <h3 class="apple-tagline mb-1" style="font-size: 22px;" th:text="${bookmark.content.wordOrStructure}">word</h3>
                                <div class="apple-caption text-primary" th:text="${bookmark.content.ipa}">/ipa/</div>
                            </div>
                            <form method="post" th:action="@{/student/dictionary/bookmark/{id}/delete(id=${bookmark.content.id})}">
                                <input type="hidden" name="returnUrl" th:value="@{/student/bookmarks}">
                                <button class="btn-apple btn-apple-dark-utility btn-action" style="font-size: 13px; padding: 7px 12px;" type="submit">
                                    Bỏ lưu
                                </button>
                            </form>
                        </div>
                        <p class="mb-2" th:if="${bookmark.content.meaning != null && !bookmark.content.meaning.isBlank()}">
                            <strong>Nghĩa:</strong> <span th:text="${bookmark.content.meaning}">meaning</span>
                        </p>
                        <p class="apple-caption mb-3" style="color: var(--apple-ink-muted-80);" th:text="${bookmark.content.example}">
                            example
                        </p>
                        <a class="text-decoration-none"
                           th:href="@{/student/lessons/{id}(id=${bookmark.content.lessonId})}"
                           th:text="${bookmark.content.lessonTitle}">
                            Lesson
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
