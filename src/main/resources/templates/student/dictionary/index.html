<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Từ điển')}"><title>Từ điển</title></head>
<body class="apple-theme">
<div id="wrapper">
    <div th:replace="~{fragments/layout :: sidebar(${user}, 'dictionary')}"></div>

    <div id="page-content-wrapper" class="d-flex flex-column">
        <nav th:replace="~{fragments/layout :: navbar(${user})}"></nav>

        <div class="container-fluid my-4 flex-grow-1 px-4">
            <div class="page-header d-flex flex-column flex-lg-row justify-content-between align-items-lg-center">
                <div class="mb-3 mb-lg-0">
                    <h2 class="apple-display-lg mb-1">
                        <i class="fa-solid fa-book-bookmark me-2 text-primary"></i> Từ điển
                    </h2>
                    <p class="apple-lead" style="font-size: 17px; color: var(--apple-body-muted); margin-bottom: 0;">
                        Tra nhanh từ vựng, cấu trúc và lưu mục yêu thích
                    </p>
                </div>
                <a class="btn-apple btn-apple-primary btn-action" th:href="@{/student/bookmarks}">
                    <i class="fa-solid fa-bookmark me-1"></i> Từ đã lưu
                </a>
            </div>

            <div class="apple-store-utility-card p-3 mb-4" style="height: auto;">
                <form class="row g-3" method="get" th:action="@{/student/dictionary}">
                    <div class="col-md-6">
                        <label>
                            <input class="apple-text-field" style="height: 40px; padding: 8px 16px; font-size: 15px;"
                                   type="text" name="keyword" placeholder="Nhập từ khóa, nghĩa, cấu trúc..."
                                   th:value="${keyword}">
                        </label>
                    </div>
                    <div class="col-md-4">
                        <label>
                            <select class="apple-text-field" style="height: 40px; padding: 0 16px; font-size: 15px;" name="lessonId">
                                <option value="">Tất cả bài học</option>
                                <option th:each="lesson : ${lessons}"
                                        th:value="${lesson.id}"
                                        th:text="${lesson.title}"
                                        th:selected="${selectedLessonId == lesson.id}">
                                </option>
                            </select>
                        </label>
                    </div>
                    <div class="col-md-2">
                        <button class="btn-apple btn-apple-primary w-100 btn-action" style="height: 40px; font-size: 14px;" type="submit">
                            Tra cứu
                        </button>
                    </div>
                </form>
            </div>

            <div class="apple-store-utility-card p-4" style="height: auto;">
                <div class="table-responsive">
                    <table class="table table-borderless align-middle m-0" style="font-family: var(--apple-font-text);">
                        <thead>
                        <tr style="border-bottom: 1px solid var(--apple-hairline); color: var(--apple-ink-muted-80);">
                            <th class="pb-3" style="font-size: 14px; font-weight: 600;">Từ / Cấu trúc</th>
                            <th class="pb-3" style="font-size: 14px; font-weight: 600;">IPA</th>
                            <th class="pb-3" style="font-size: 14px; font-weight: 600;">Nghĩa</th>
                            <th class="pb-3" style="font-size: 14px; font-weight: 600;">Bài học</th>
                            <th class="pb-3 text-center" style="font-size: 14px; font-weight: 600;">Lưu</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${results == null || results.isEmpty()}">
                            <td colspan="5" class="text-center py-5 text-muted">Không tìm thấy kết quả phù hợp.</td>
                        </tr>
                        <tr th:each="content : ${results}" style="border-bottom: 1px solid var(--apple-divider-soft);">
                            <td class="py-3">
                                <div class="fw-semibold text-dark" th:text="${content.wordOrStructure}">word</div>
                                <div class="apple-caption text-muted text-truncate" style="max-width: 360px;" th:text="${content.example}">example</div>
                            </td>
                            <td class="py-3 text-primary" th:text="${content.ipa}">/ipa/</td>
                            <td class="py-3" th:text="${content.meaning}">meaning</td>
                            <td class="py-3">
                                <a class="text-decoration-none" th:href="@{/student/lessons/{id}(id=${content.lessonId})}" th:text="${content.lessonTitle}">
                                    Lesson
                                </a>
                            </td>
                            <td class="py-3 text-center">
                                <form method="post"
                                      th:action="${bookmarkedContentIds.contains(content.id)}
                                          ? @{/student/dictionary/bookmark/{id}/delete(id=${content.id})}
                                          : @{/student/dictionary/bookmark/{id}(id=${content.id})}">
                                    <input type="hidden" name="returnUrl" th:value="@{/student/dictionary(keyword=${keyword}, lessonId=${selectedLessonId})}">
                                    <button class="btn-apple btn-action"
                                            th:classappend="${bookmarkedContentIds.contains(content.id)} ? ' btn-apple-dark-utility' : ' btn-apple-pearl-capsule'"
                                            style="font-size: 13px; padding: 7px 12px;"
                                            type="submit">
                                        <i th:class="${bookmarkedContentIds.contains(content.id)} ? 'fa-solid fa-bookmark me-1' : 'fa-regular fa-bookmark me-1'"></i>
                                        <span th:text="${bookmarkedContentIds.contains(content.id)} ? 'Đã lưu' : 'Lưu'">Lưu</span>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <nav class="mt-4" th:if="${dictionaryPage != null && dictionaryPage.totalPages > 1}">
                    <ul class="pagination justify-content-center mb-0">
                        <li class="page-item" th:classappend="${dictionaryPage.first} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/student/dictionary(page=${dictionaryPage.number - 1}, size=${size}, keyword=${keyword}, lessonId=${selectedLessonId})}">
                                Trước
                            </a>
                        </li>
                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, dictionaryPage.totalPages - 1)}"
                            th:classappend="${i == dictionaryPage.number} ? 'active'">
                            <a class="page-link"
                               th:text="${i + 1}"
                               th:href="@{/student/dictionary(page=${i}, size=${size}, keyword=${keyword}, lessonId=${selectedLessonId})}">
                                1
                            </a>
                        </li>
                        <li class="page-item" th:classappend="${dictionaryPage.last} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/student/dictionary(page=${dictionaryPage.number + 1}, size=${size}, keyword=${keyword}, lessonId=${selectedLessonId})}">
                                Sau
                            </a>
                        </li>
                    </ul>
                    <p class="text-center text-muted mt-2 mb-0 apple-caption"
                       th:text="${'Hiển thị ' + dictionaryPage.numberOfElements + ' / ' + dictionaryPage.totalElements + ' mục từ'}">
                        Hiển thị mục từ
                    </p>
                </nav>
            </div>
        </div>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
