<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử làm bài</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5" style="max-width: 900px;">
    <div class="mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h2 class="fw-bold text-dark"><i class="fa-solid fa-clock-rotate-left text-primary me-2"></i> Lịch Sử Làm Bài</h2>
            <p class="text-muted mb-0">Xem lại danh sách kết quả các bài kiểm tra đã thực hiện</p>
        </div>
        <a href="/exams" class="btn btn-outline-primary fw-bold"><i class="fa-solid fa-chevron-left me-1"></i> Về kho đề</a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th scope="col" class="ps-4 py-3">STT</th>
                        <th scope="col" class="py-3">Tên đề thi</th>
                        <th scope="col" class="py-3">Ngày làm bài</th>
                        <th scope="col" class="py-3 text-center">Kết quả</th>
                        <th scope="col" class="pe-4 py-3 text-center">Trạng thái</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${histories == null || histories.isEmpty()}">
                        <td colspan="5" class="text-center py-5 text-muted">Bạn chưa thực hiện bài thi nào.</td>
                    </tr>

                    <tr th:each="history, iterStat : ${histories}">
                        <td class="ps-4 fw-bold" th:text="${iterStat.count}">1</td>
                        <td>
                            <div class="fw-bold text-dark" th:text="${history.examTitle}">Đề số 1</div>
                        </td>
                        <td th:text="${history.testedAt != null ? history.testedAt : 'Hôm nay'}">25/06/2026</td>
                        <td class="text-center fw-bold text-success fs-5" th:text="${history.score + ' đ'}">8.0 đ</td>
                        <td class="pe-4 text-center">
                            <span class="badge bg-success-subtle text-success px-3 py-2 rounded-pill">Hoàn thành</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
