<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Flashcard Review</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .flashcard-container {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            justify-content: center;
        }

        .flashcard {
            width: 340px;
            height: 260px;
            perspective: 1000px;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        .flashcard-front,
        .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            background: white;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 20px;
            text-align: center;
        }

        .flashcard-front h2 {
            font-size: 32px;
            margin: 0 0 10px;
            color: #2563eb;
        }

        .ipa {
            color: #666;
            font-style: italic;
            margin-bottom: 16px;
        }

        .flashcard-back {
            transform: rotateY(180deg);
            overflow-y: auto;
        }

        .flashcard-back h3 {
            margin-bottom: 10px;
            color: #111827;
        }

        .example {
            margin-top: 12px;
            color: #374151;
        }

        .review-buttons {
            margin-top: 16px;
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .review-buttons button {
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .again {
            background: #dc2626;
        }

        .hard {
            background: #f97316;
        }

        .good {
            background: #16a34a;
        }

        .easy {
            background: #2563eb;
        }

        .empty-message {
            text-align: center;
            color: #555;
            font-size: 18px;
        }
    </style>
</head>
<body>

<h1 class="page-title">Flashcard Review</h1>

<div th:if="${#lists.isEmpty(reviews)}" class="empty-message">
    Hôm nay bạn chưa có flashcard nào cần ôn.
</div>

<div class="flashcard-container" th:if="${!#lists.isEmpty(reviews)}">

    <div th:each="review : ${reviews}">

        <div class="flashcard" onclick="flipCard(this)">
            <div class="flashcard-inner">

                <div class="flashcard-front">
                    <h2 th:text="${review.content.wordOrStructure}">Word</h2>

                    <p class="ipa"
                       th:if="${review.content.ipa != null}"
                       th:text="${review.content.ipa}">
                        IPA
                    </p>

                    <p>Bấm vào thẻ để xem đáp án</p>
                </div>

                <div class="flashcard-back">
                    <h3 th:text="${review.content.meaning}">Meaning</h3>

                    <p th:if="${review.content.explanation != null}"
                       th:text="${review.content.explanation}">
                        Explanation
                    </p>

                    <p class="example"
                       th:if="${review.content.example != null}">
                        <strong>Example:</strong>
                        <span th:text="${review.content.example}">Example</span>
                    </p>
                </div>

            </div>
        </div>

        <form class="review-buttons"
              th:action="@{/student/flashcards/{contentId}/review(contentId=${review.content.id})}"
              method="post">

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <button class="again" type="submit" name="result" value="AGAIN">Again</button>
            <button class="hard" type="submit" name="result" value="HARD">Hard</button>
            <button class="good" type="submit" name="result" value="GOOD">Good</button>
            <button class="easy" type="submit" name="result" value="EASY">Easy</button>
        </form>

    </div>

</div>

<script>
    function flipCard(card) {
        card.classList.toggle("flipped");
    }
</script>

</body>
</html>
