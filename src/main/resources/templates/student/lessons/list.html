<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Kho bài học')}"><title>Kho Bài Học</title></head>
<body class="apple-theme">
<div id="wrapper">
    <div th:replace="~{fragments/layout :: sidebar(${user}, 'learning')}"></div>

    <div id="page-content-wrapper" class="d-flex flex-column">
        <nav th:replace="~{fragments/layout :: navbar(${user})}"></nav>

        <div class="container-fluid my-4 flex-grow-1 px-4">
            <div class="page-header d-flex flex-column flex-lg-row justify-content-between align-items-lg-center">
                <div class="mb-3 mb-lg-0">
                    <h2 class="apple-display-lg mb-1">
                        <i class="fa-solid fa-book-open-reader me-2 text-primary"></i> Kho bài học
                    </h2>
                    <p class="apple-lead" style="font-size: 17px; color: var(--apple-body-muted); margin-bottom: 0;">
                        Ngữ pháp, từ vựng và IPA theo cấp độ CEFR
                    </p>
                </div>
                <a class="btn-apple btn-apple-primary btn-action" th:href="@{/student/dictionary}">
                    <i class="fa-solid fa-magnifying-glass me-1"></i> Tra từ nhanh
                </a>
            </div>

            <div class="apple-store-utility-card p-3 mb-4" style="height: auto;">
                <form class="row g-3" method="get" th:action="@{/student/lessons}">
                    <div class="col-md-4">
                        <label>
                            <input class="apple-text-field" style="height: 40px; padding: 8px 16px; font-size: 15px;"
                                   type="text" name="keyword" placeholder="Tìm bài học, chủ đề..."
                                   th:value="${keyword}">
                        </label>
                    </div>
                    <div class="col-md-3">
                        <label>
                            <select class="apple-text-field" style="height: 40px; padding: 0 16px; font-size: 15px;" name="type">
                                <option value="">Tất cả loại bài</option>
                                <option th:each="t : ${types}" th:value="${t}" th:text="${t}" th:selected="${selectedType == t}"></option>
                            </select>
                        </label>
                    </div>
                    <div class="col-md-3">
                        <label>
                            <select class="apple-text-field" style="height: 40px; padding: 0 16px; font-size: 15px;" name="level">
                                <option value="">Tất cả CEFR</option>
                                <option th:each="l : ${levels}" th:value="${l}" th:text="${l}" th:selected="${selectedLevel == l}"></option>
                            </select>
                        </label>
                    </div>
                    <div class="col-md-2">
                        <button class="btn-apple btn-apple-primary w-100 btn-action" style="height: 40px; font-size: 14px;" type="submit">
                            Lọc bài
                        </button>
                    </div>
                </form>
            </div>

            <div class="row g-4">
                <div class="col-12" th:if="${lessons == null || lessons.isEmpty()}">
                    <div class="apple-store-utility-card p-5 text-center" style="height: auto;">
                        <p class="text-muted mb-0">Chưa có bài học phù hợp với bộ lọc hiện tại.</p>
                    </div>
                </div>

                <div class="col-md-6 col-xl-4" th:each="lesson : ${lessons}">
                    <div class="apple-store-utility-card p-4 h-100" style="height: auto;">
                        <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
                            <div>
                                <span class="badge bg-light text-dark border px-2 py-1 me-1" th:text="${lesson.type}">VOCABULARY</span>
                                <span class="badge bg-primary-subtle text-primary px-2 py-1" th:text="${lesson.level}">A1</span>
                            </div>
                            <span class="badge bg-success-subtle text-success px-2 py-1"
                                  th:if="${completedLessonIds.contains(lesson.id)}">
                                Đã hoàn thành
                            </span>
                        </div>

                        <h3 class="apple-tagline mb-2" style="font-size: 22px;" th:text="${lesson.title}">Lesson title</h3>
                        <p class="apple-caption mb-4" style="color: var(--apple-ink-muted-80); min-height: 42px;"
                           th:text="${lesson.description ?: 'Bài học đang được cập nhật nội dung.'}">
                            Mô tả bài học
                        </p>

                        <div class="d-flex justify-content-between align-items-center">
                            <a class="btn-apple btn-apple-primary btn-action"
                               style="font-size: 14px; padding: 9px 16px;"
                               th:href="@{/student/lessons/{id}(id=${lesson.id})}">
                                Vào học
                            </a>
                            <a class="btn-apple btn-apple-secondary-pill btn-action"
                               style="font-size: 14px; padding: 9px 16px;"
                               th:if="${!completedLessonIds.contains(lesson.id)}"
                               th:href="@{/student/lessons/{id}/complete(id=${lesson.id})}">
                                Đã hoàn thành
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments/pagination :: pagination(page=${lessonPage}, entityName='bài học')}"></div>
        </div>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
