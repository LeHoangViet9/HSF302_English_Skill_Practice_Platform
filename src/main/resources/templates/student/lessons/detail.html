<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head(${lesson.title})}"></head>
<body class="apple-theme">
<div id="wrapper">
    <div th:replace="~{fragments/layout :: sidebar(${user}, 'learning')}"></div>

    <div id="page-content-wrapper" class="d-flex flex-column">
        <nav th:replace="~{fragments/layout :: navbar(${user})}"></nav>

        <div class="container-fluid my-4 flex-grow-1 px-4">
            <div class="page-header d-flex flex-column flex-lg-row justify-content-between align-items-lg-center">
                <div class="mb-3 mb-lg-0">
                    <div class="mb-2">
                        <span class="badge bg-light text-dark border px-2 py-1 me-1" th:text="${lesson.type}">VOCABULARY</span>
                        <span class="badge bg-primary-subtle text-primary px-2 py-1" th:text="${lesson.level}">A1</span>
                    </div>
                    <h2 class="apple-display-lg mb-1" th:text="${lesson.title}">Lesson title</h2>
                    <p class="apple-lead" style="font-size: 17px; color: var(--apple-body-muted); margin-bottom: 0;"
                       th:text="${lesson.description}">
                        Mô tả bài học
                    </p>
                </div>
                <a class="btn-apple btn-apple-primary btn-action"
                   th:if="${!completed}"
                   th:href="@{/student/lessons/{id}/complete(id=${lesson.id})}">
                    <i class="fa-solid fa-check me-1"></i> Đã hoàn thành
                </a>
                <span class="btn-apple btn-apple-secondary-pill" th:if="${completed}">
                    <i class="fa-solid fa-circle-check me-1"></i> Đã hoàn thành
                </span>
            </div>

            <div class="apple-store-utility-card p-4 mb-4" style="height: auto;">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3 class="apple-tagline mb-0">Nội dung bài học</h3>
                    <a class="btn-apple btn-apple-pearl-capsule btn-action" th:href="@{/student/lessons}">
                        <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
                    </a>
                </div>

                <div th:if="${contents == null || contents.isEmpty()}" class="text-center py-5 text-muted">
                    Bài học này chưa có nội dung chi tiết.
                </div>

                <div class="row g-3" th:if="${contents != null && !contents.isEmpty()}">
                    <div class="col-12" th:each="content : ${contents}">
                        <div class="p-3 border rounded-3 bg-white">
                            <div class="d-flex flex-column flex-md-row justify-content-between gap-2 mb-2">
                                <div>
                                    <h4 class="apple-body-strong mb-1" style="font-size: 18px;" th:text="${content.wordOrStructure}">
                                        word
                                    </h4>
                                    <div class="apple-caption text-primary" th:if="${content.ipa != null && !content.ipa.isBlank()}" th:text="${content.ipa}">
                                        /ipa/
                                    </div>
                                </div>
                                <form method="post" th:action="@{/student/dictionary/bookmark/{id}(id=${content.id})}">
                                    <input type="hidden" name="returnUrl" th:value="@{/student/lessons/{id}(id=${lesson.id})}">
                                    <button class="btn-apple btn-apple-pearl-capsule btn-action" style="font-size: 13px; padding: 7px 12px;" type="submit">
                                        <i class="fa-regular fa-bookmark me-1"></i> Lưu từ
                                    </button>
                                </form>
                            </div>
                            <p class="mb-2" th:if="${content.meaning != null && !content.meaning.isBlank()}">
                                <strong>Nghĩa:</strong> <span th:text="${content.meaning}">meaning</span>
                            </p>
                            <p class="mb-2" th:if="${content.explanation != null && !content.explanation.isBlank()}" th:text="${content.explanation}">
                                explanation
                            </p>
                            <p class="mb-0 apple-caption" style="color: var(--apple-ink-muted-80);"
                               th:if="${content.example != null && !content.example.isBlank()}">
                                <strong>Ví dụ:</strong> <span th:text="${content.example}">example</span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
