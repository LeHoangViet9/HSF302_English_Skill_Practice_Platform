<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi yêu cầu hỗ trợ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white py-3">
            <h4 class="mb-0 fw-bold"><i class="fa-solid fa-headset me-2"></i> Báo Cáo Lỗi / Yêu Cầu Hỗ Trợ</h4>
        </div>
        <div class="card-body p-4">

            <form th:action="@{/support-tickets/user/{id}(id=${userId})}" th:object="${ticketRequest}" method="post">
                <input type="hidden" th:field="*{userId}" />

                <div class="mb-3">
                    <label for="title" class="form-label fw-bold text-secondary">Tiêu đề lỗi <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="title" th:field="*{title}"
                           placeholder="Ví dụ: Lỗi hỏng Micro khi làm bài Nói, Lỗi mất kết nối..." required>
                </div>

                <div class="mb-4">
                    <label for="description" class="form-label fw-bold text-secondary">Mô tả chi tiết sự cố <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="description" th:field="*{description}" rows="5"
                              placeholder="Vui lòng mô tả rõ bạn gặp sự cố ở câu hỏi nào, bài thi nào để Admin hỗ trợ nhanh nhất..." required></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/support-tickets/user/{id}(id=${userId})}" class="btn btn-outline-secondary px-4">Hủy bỏ</a>
                    <button type="submit" class="btn btn-primary px-4 fw-bold">
                        <i class="fa-solid fa-paper-plane me-1"></i> Gửi Yêu Cầu
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
