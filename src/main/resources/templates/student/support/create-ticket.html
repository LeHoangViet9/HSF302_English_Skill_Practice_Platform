<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Gửi yêu cầu hỗ trợ')}"></head>
<body class="apple-theme">
<div id="wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar(${user}, 'support')}"></div>

    <!-- Page Content -->
    <div id="page-content-wrapper" class="d-flex flex-column">
        <!-- Navbar -->
        <nav th:replace="~{fragments/layout :: navbar(${user})}"></nav>

        <div class="container-fluid my-4 flex-grow-1 px-4 d-flex justify-content-center">
            <div class="apple-store-utility-card p-4" style="max-width: 600px; width: 100%; height: fit-content;">
                <!-- Card Header -->
                <div style="border-bottom: 1px solid var(--apple-hairline); padding-bottom: 16px; margin-bottom: 24px;">
                    <h4 class="apple-tagline mb-0" style="font-size: 21px; display: flex; align-items: center; gap: 8px;">
                        <i class="fa-solid fa-headset text-primary"></i> Báo Cáo Lỗi / Yêu Cầu Hỗ Trợ
                    </h4>
                </div>

                <!-- Form -->
                <form th:action="@{/student/support-tickets/user/{id}(id=${userId})}" th:object="${ticketRequest}" method="post">
                    <input type="hidden" th:field="*{userId}" />

                    <div class="mb-3">
                        <label for="title" class="apple-caption-strong" style="color: var(--apple-ink); margin-bottom: 6px; display: block;">
                            Tiêu đề lỗi <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="apple-text-field" id="title" th:field="*{title}"
                               placeholder="Ví dụ: Lỗi hỏng Micro khi làm bài Nói, Lỗi mất kết nối..." required>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="apple-caption-strong" style="color: var(--apple-ink); margin-bottom: 6px; display: block;">
                            Mô tả chi tiết sự cố <span class="text-danger">*</span>
                        </label>
                        <textarea class="apple-text-field" id="description" th:field="*{description}" rows="5" style="height: auto;"
                                  placeholder="Vui lòng mô tả rõ bạn gặp sự cố ở câu hỏi nào, bài thi nào để Admin hỗ trợ nhanh nhất..." required></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/student/support-tickets/user/{id}(id=${userId})}" class="btn-apple btn-apple-secondary-pill" style="font-size: 14px; padding: 10px 20px;">Hủy bỏ</a>
                        <button type="submit" class="btn-apple btn-apple-primary btn-action" style="font-size: 14px; padding: 10px 20px;">
                            <i class="fa-solid fa-paper-plane me-1"></i> Gửi Yêu Cầu
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Footer -->
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
