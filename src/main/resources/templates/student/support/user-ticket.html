<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Hộp thư Hỗ trợ & Thông báo')}"></head>
<body class="apple-theme">
<div id="wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar(${user}, 'support')}"></div>

    <!-- Page Content -->
    <div id="page-content-wrapper" class="d-flex flex-column">
        <!-- Navbar -->
        <nav th:replace="~{fragments/layout :: navbar(${user})}"></nav>

        <div class="container-fluid my-4 flex-grow-1 px-4">
            <!-- Header Hộp thư -->
            <div class="page-header d-flex flex-column flex-sm-row justify-content-between align-items-sm-center">
                <div class="mb-3 mb-sm-0">
                    <h2 class="apple-display-lg mb-1"><i class="fa-solid fa-bell me-2"></i> Hộp Thư Hỗ Trợ</h2>
                    <p class="apple-lead" style="font-size: 17px; color: var(--apple-body-muted); margin-bottom: 0;">Theo dõi trạng thái báo lỗi và phản hồi từ hệ thống</p>
                </div>
                <div class="d-flex gap-2">
                    <a href="/exams" class="btn-apple btn-apple-secondary-pill" style="font-size: 14px; padding: 10px 20px;">
                        <i class="fa-solid fa-chevron-left me-1"></i> Về kho đề
                    </a>
                    <a th:href="@{/student/support-tickets/user/{id}/new(id=${userId})}" class="btn-apple btn-apple-primary btn-action" style="font-size: 14px; padding: 10px 20px;">
                        <i class="fa-solid fa-plus me-1"></i> Gửi Yêu Cầu Mới
                    </a>
                </div>
            </div>

            <!-- Thông báo thành công -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show border-0 shadow-none mb-4" 
                 style="background-color: #e6f4ea; border: 1px solid #ceead6 !important; color: #137333; border-radius: var(--apple-rounded-md);" role="alert">
                <div class="apple-caption">
                    <i class="fa-solid fa-circle-check me-2 fs-5"></i> <span th:text="${successMessage}">Thao tác thành công!</span>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Khi không có yêu cầu nào -->
            <div th:if="${tickets == null || tickets.isEmpty()}" class="apple-store-utility-card p-5 justify-content-center align-items-center">
                <i class="fa-regular fa-folder-open text-muted fs-1 mb-3"></i>
                <p class="card-description mb-0">Bạn chưa có yêu cầu hỗ trợ hoặc thông báo lỗi nào.</p>
            </div>

            <!-- Danh sách các Ticket -->
            <div th:if="${tickets != null && !tickets.isEmpty()}">
                <div th:each="ticket : ${tickets}" class="apple-store-utility-card mb-3"
                     th:style="'border-left: 4px solid ' + (${ticket.status == 'OPEN' ? '#ffc107' : 
                                                            ticket.status == 'IN_PROGRESS' ? '#0066cc' : 
                                                            ticket.status == 'RESOLVED' ? '#34c759' : '#7a7a7a'}) + ' !important; padding: 24px;'">

                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="card-title mb-1" style="font-size: 19px;" th:text="${ticket.title}">Lỗi không phát được audio câu hỏi 3</h5>
                            <p class="card-description mb-2" th:text="${ticket.description}">Mô tả chi tiết lỗi.</p>
                            <small class="apple-fine-print" style="color: var(--apple-ink-muted-48);">
                                <i class="fa-regular fa-clock me-1"></i>
                                <span th:text="${#temporals.format(ticket.createdAt, 'dd/MM/yyyy HH:mm')}">Vừa mới gửi</span>
                            </small>
                        </div>

                        <div class="text-end">
                            <span th:if="${ticket.status == 'OPEN'}" class="badge bg-warning text-dark px-3 py-2" style="border-radius: var(--apple-rounded-pill); font-size: 12px;">
                                <i class="fa-solid fa-spinner fa-spin me-1"></i> Đang Chờ Xử Lý
                            </span>
                            <span th:if="${ticket.status == 'IN_PROGRESS'}" class="badge bg-primary text-white px-3 py-2" style="border-radius: var(--apple-rounded-pill); font-size: 12px;">
                                <i class="fa-solid fa-hourglass-half me-1"></i> Đang Giải Quyết
                            </span>
                            <span th:if="${ticket.status == 'RESOLVED'}" class="badge bg-success text-white px-3 py-2" style="border-radius: var(--apple-rounded-pill); font-size: 12px;">
                                <i class="fa-solid fa-circle-check me-1"></i> Đã xử lý xong!
                            </span>
                            <span th:if="${ticket.status == 'CLOSED'}" class="badge bg-secondary text-white px-3 py-2" style="border-radius: var(--apple-rounded-pill); font-size: 12px;">
                                <i class="fa-solid fa-circle-xmark me-1"></i> Đã đóng
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script th:inline="javascript">
    const userId = [[${userId}]];
    if (userId) {
        const socket = new SockJS('/ws');
        const stompClient = Stomp.over(socket);
        
        stompClient.connect({}, function (frame) {
            console.log('Connected to WebSocket: ' + frame);
            stompClient.subscribe('/topic/user/' + userId + '/notifications', function (notification) {
                alert("Thông báo từ Admin: " + notification.body);
                location.reload();
            });
        });
    }
</script>
</body>
</html>
