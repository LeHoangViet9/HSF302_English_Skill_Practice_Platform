<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Kết Quả Bài Thi')}"></head>
<body class="apple-theme">
<div id="wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar(${user}, 'exams')}"></div>

    <!-- Page Content -->
    <div id="page-content-wrapper" class="d-flex flex-column">
        <!-- Navbar -->
        <nav th:replace="~{fragments/layout :: navbar(${user})}"></nav>

        <div class="container-fluid my-4 flex-grow-1 px-4 d-flex justify-content-center align-items-center">
            <div class="apple-store-utility-card text-center p-5" style="max-width: 600px; width: 100%; height: fit-content;">
                <div class="text-success display-1 mb-3">
                    <i class="fa-solid fa-circle-check"></i>
                </div>

                <h2 class="apple-hero-display" style="font-size: 34px; color: var(--apple-ink); margin-bottom: 8px;">Nộp Bài Thành Công!</h2>
                <p class="card-description" style="margin-bottom: 24px;">Hệ thống đã tự động chấm điểm bài làm của bạn.</p>

                <hr style="border-top: 1px solid var(--apple-hairline); margin: 24px 0; opacity: 1;">

                <div class="row bg-light p-3 rounded-3 border mb-4 mx-1" style="border-color: var(--apple-hairline) !important;">
                    <div class="col-6 border-end" style="border-color: var(--apple-hairline) !important;">
                        <h6 class="apple-caption-strong" style="color: var(--apple-ink-muted-80); text-transform: uppercase;">Tổng số câu đúng</h6>
                        <h3 class="apple-tagline mt-1 text-primary" th:text="${result.correctAnswersCount + ' / ' + result.totalQuestions}">35 / 40</h3>
                    </div>
                    <div class="col-6">
                        <h6 class="apple-caption-strong" style="color: var(--apple-ink-muted-80); text-transform: uppercase;">Điểm số đạt được</h6>
                        <h3 class="apple-tagline mt-1 text-success" th:text="${result.score + ' đ'}">8.5 đ</h3>
                    </div>
                </div>

                <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                    <a href="/exams" class="btn-apple btn-apple-primary btn-action" style="font-size: 14px; padding: 12px 24px;">Tiếp tục luyện đề</a>
                    <a th:href="@{/histories/user/{id}(id=${user.id})}" class="btn-apple btn-apple-secondary-pill btn-action" style="font-size: 14px; padding: 12px 24px;">Xem lịch sử thi</a>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
