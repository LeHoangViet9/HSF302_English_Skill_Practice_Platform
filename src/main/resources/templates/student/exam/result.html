<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết Quả Bài Thi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card text-center shadow p-4" style="max-width: 600px; width: 100%;">
    <div class="card-body">
        <div class="text-success display-1 mb-3">
            <i class="fa-solid fa-circle-check"></i>
        </div>

        <h2 class="fw-bold mb-2">Nộp Bài Thành Công!</h2>
        <p class="text-muted">Hệ thống đã tự động chấm điểm bài làm của bạn.</p>

        <hr class="my-4">

        <div class="row bg-white p-3 rounded-3 border mb-4 mx-1 shadow-sm">
            <div class="col-6 border-end">
                <h6 class="text-secondary uppercase fw-bold small">Tổng số câu đúng</h6>
                <h3 class="fw-bold text-primary mt-1" th:text="${result.correctAnswersCount + ' / ' + result.totalQuestions}">35 / 40</h3>
            </div>
            <div class="col-6">
                <h6 class="text-secondary uppercase fw-bold small">Điểm số đạt được</h6>
                <h3 class="fw-bold text-success mt-1" th:text="${result.score + ' đ'}">8.5 đ</h3>
            </div>
        </div>

        <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
            <a href="/exams" class="btn btn-primary btn-lg px-4 gap-3 fw-bold">Tiếp tục luyện đề</a>
            <a href="/histories/user/1" class="btn btn-outline-secondary btn-lg px-4">Xem lịch sử thi</a>
        </div>
    </div>
</div>

</body>
</html>
