<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách đề thi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/student/exams"><i class="fa-solid fa-graduation-cap me-2"></i> ES Platform</a>
        <div class="d-flex">
            <a href="/support-tickets/user/1" class="btn btn-light btn-sm fw-bold px-3"><i class="fa-solid fa-bell me-1"></i> Hỗ trợ</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="mb-4">
        <h3 class="fw-bold text-dark">Kho Đề Thi & Bài Luyện Tập</h3>
        <p class="text-muted">Chọn một đề thi bên dưới để bắt đầu rèn luyện đầy đủ 4 kỹ năng.</p>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
        <span th:text="${successMessage}">Thao tác thành công!</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row">
        <div th:each="exam : ${exams}" class="col-md-4 mb-4">
            <div class="card h-100 shadow-sm border-0 transition-hover">
                <div class="card-body p-4">
                    <div class="d-flex align-items-center mb-3">
                        <div class="bg-primary-subtle text-primary rounded p-3 me-3">
                            <i class="fa-solid fa-file-lines fs-4"></i>
                        </div>
                        <div>
                            <h5 class="card-title fw-bold mb-1" th:text="${exam.title}">Đề thi mẫu</h5>
                            <span class="badge bg-secondary" th:text="${exam.duration + ' phút'}">60 phút</span>
                        </div>
                    </div>
                    <p class="card-text text-muted small" th:text="${exam.description != null ? exam.description : 'Đề luyện thi chuẩn cấu trúc đầy đủ kỹ năng Nghe, Nói, Đọc, Viết.'}"></p>
                </div>
                <div class="card-footer bg-white border-0 p-4 pt-0">
                    <a th:href="@{/student/exams/{id}/take(id=${exam.id})}" class="btn btn-primary w-100 fw-bold py-2">
                        Bắt Đầu Làm Bài <i class="fa-solid fa-arrow-right ms-1"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
