<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth/auth-shared.css}">
    <link rel="stylesheet" th:href="@{/css/auth/reset-password.css}">
</head>

<body class="auth-page">

    <div th:replace="~{fragments/auth-topbar :: authTopBar}"></div>

    <main class="auth-main">
        <div class="auth-petal auth-petal-1" aria-hidden="true"></div>
        <div class="auth-petal auth-petal-2" aria-hidden="true"></div>
        <div class="auth-petal auth-petal-3" aria-hidden="true"></div>
        <div class="auth-petal auth-petal-4" aria-hidden="true"></div>
        <div class="auth-petal auth-petal-5" aria-hidden="true"></div>
        <div class="auth-petal auth-petal-6" aria-hidden="true"></div>

        <!-- State 1: Token không hợp lệ / thiếu -->
        <div class="auth-card" th:if="${invalidToken}">
            <svg class="rp-icon-error" width="48" height="48" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
                <rect width="48" height="48" rx="24" fill="#FDE0EC"></rect>
                <path d="M16 16l16 16M32 16l-16 16" stroke="#E03131" stroke-width="2.5" stroke-linecap="round"></path>
            </svg>
            <h2 class="rp-invalid-title">Link không hợp lệ</h2>
            <p class="rp-invalid-desc">Link đặt lại mật khẩu không hợp lệ hoặc đã hết hạn. Vui lòng yêu cầu gửi lại
                link mới.</p>
            <a class="btn-rp-submit" th:href="@{/forgot-password}">Gửi lại link</a>
        </div>

        <!-- State 3: Đặt lại thành công -->
        <div class="auth-card rp-success-content" th:if="${done}">
            <svg class="rp-icon-success" width="48" height="48" viewBox="0 0 48 48" aria-hidden="true"
                focusable="false">
                <rect width="48" height="48" rx="24" fill="#E8F5E9"></rect>
                <path d="M14 24l7 7 13-13" stroke="#1AAE39" stroke-width="2.5" stroke-linecap="round"
                    stroke-linejoin="round"></path>
            </svg>
            <h2 class="rp-success-title" tabindex="-1">Đặt lại mật khẩu thành công</h2>
            <p class="rp-success-desc">Mật khẩu của bạn đã được cập nhật.</p>
            <a class="btn-rp-submit" th:href="@{/login}">Đăng nhập ngay</a>
        </div>

        <!-- State 2: Form đặt mật khẩu mới -->
        <div class="auth-card" th:if="${invalidToken == null and done == null}">

            <h1 class="auth-title">Đặt lại mật khẩu</h1>
            <p class="auth-subtitle">Nhập mật khẩu mới cho tài khoản của bạn.</p>

            <div class="auth-banner auth-error-banner" th:if="${error != null}">
                <span th:text="${error}"></span>
            </div>

            <form class="rp-form" id="resetPasswordForm" th:action="@{/reset-password}" method="post"
                th:object="${resetPasswordForm}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" th:field="*{token}" />

                <div class="form-field">
                    <label for="rp-new">Mật khẩu mới</label>
                    <div class="password-input-wrapper">
                        <input id="rp-new" th:field="*{newPassword}" type="password" class="form-input"
                            th:classappend="${#fields.hasErrors('newPassword')} ? 'has-error' : ''" th:attr="aria-invalid=${#fields.hasErrors('newPassword')} ? 'true' : 'false',
                                     aria-describedby='rp-new-error'" placeholder="Ít nhất 8 ký tự, 1 hoa, 1 số"
                            autocomplete="new-password" autofocus="autofocus" />
                        <button type="button" class="password-toggle" data-target="rp-new" aria-label="Hiện mật khẩu">
                            <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                aria-hidden="true" focusable="false">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                aria-hidden="true" focusable="false">
                                <path
                                    d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                                </path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                    <span id="rp-new-error" class="field-error" th:if="${#fields.hasErrors('newPassword')}"
                        th:errors="*{newPassword}"></span>
                </div>

                <div class="form-field">
                    <label for="rp-confirm">Xác nhận mật khẩu mới</label>
                    <div class="password-input-wrapper">
                        <input id="rp-confirm" th:field="*{confirmPassword}" type="password" class="form-input"
                            th:classappend="${#fields.hasErrors('confirmPassword')} ? 'has-error' : ''" th:attr="aria-invalid=${#fields.hasErrors('confirmPassword')} ? 'true' : 'false',
                                     aria-describedby='rp-confirm-error'" placeholder="Nhập lại mật khẩu mới"
                            autocomplete="new-password" />
                        <button type="button" class="password-toggle" data-target="rp-confirm"
                            aria-label="Hiện mật khẩu">
                            <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                aria-hidden="true" focusable="false">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                aria-hidden="true" focusable="false">
                                <path
                                    d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                                </path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                    <span id="rp-confirm-error" class="field-error" th:if="${#fields.hasErrors('confirmPassword')}"
                        th:errors="*{confirmPassword}"></span>
                </div>

                <button class="btn-rp-submit" type="submit">Đặt lại mật khẩu</button>
            </form>
        </div>
    </main>

    <script th:src="@{/js/auth/auth.js}"></script>
</body>

</html>
