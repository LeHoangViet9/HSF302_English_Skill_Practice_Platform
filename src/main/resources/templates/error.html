<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title : 'Có lỗi xảy ra'}">Thông báo lỗi</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card text-center shadow p-4" style="max-width: 500px; width: 100%;">
    <div class="card-body">
        <h1 class="display-1 fw-bold text-danger" th:text="${status != null ? status : '500'}">500</h1>

        <h3 class="mb-3" th:text="${title != null ? title : 'Đã có lỗi xảy ra'}">Lỗi Hệ Thống</h3>

        <p class="text-muted mb-4" th:text="${errorMessage}">Nội dung lỗi chi tiết sẽ hiển thị ở đây.</p>

        <a href="/" class="btn btn-primary px-4">Quay về Trang Chủ</a>
    </div>
</div>

</body>
</html>
