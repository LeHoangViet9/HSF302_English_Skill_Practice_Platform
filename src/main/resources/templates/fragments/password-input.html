<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div class="form-field" th:fragment="passwordInput(fieldId, fieldName, labelText, hasError, showForgotLink)">
        <div class="form-label-row">
            <label th:for="${fieldId}" th:text="${labelText}">Mật khẩu</label>
            <a th:if="${showForgotLink}" class="auth-forgot-link" th:href="@{/forgot-password}">Quên mật khẩu?</a>
        </div>
        <div class="password-input-wrapper">
            <input type="password" th:id="${fieldId}" th:name="${fieldName}" class="form-input"
                th:classappend="${hasError} ? 'has-error' : ''" th:attr="aria-invalid=${hasError} ? 'true' : 'false'"
                placeholder="••••••••" autocomplete="current-password" required="required" />
            <button type="button" class="password-toggle" th:attr="data-target=${fieldId}" aria-label="Hiện mật khẩu">
                <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                    focusable="false">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                    focusable="false">
                    <path
                        d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                    </path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
            </button>
        </div>
    </div>
</body>

</html>
