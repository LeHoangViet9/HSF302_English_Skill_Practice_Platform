<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<!-- Fragment cho HEAD -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">ESPP Platform</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
            color: #333;
        }
        .navbar-custom {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }
        .navbar-admin {
            background: #212529 !important;
        }
        .page-header {
            background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
            color: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .exam-card {
            border: none;
            border-radius: 12px;
            background-color: #ffffff;
            transition: all 0.3s ease-in-out;
        }
        .exam-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.08) !important;
        }
        .icon-box {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }
        .icon-box-student {
            background-color: rgba(42, 82, 152, 0.1);
            color: #2a5298;
        }
        .icon-box-admin {
            background-color: rgba(255, 193, 7, 0.1);
            color: #ffc107;
        }
        .badge-type {
            font-weight: 600;
        }
        .btn-action {
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
        }
    </style>
</head>
<body>

<!-- Fragment cho NAVBAR chung -->
<nav th:fragment="navbar(user)" class="navbar navbar-expand-lg navbar-dark shadow-sm mb-4" 
     th:classappend="${user.role.name() == 'ADMIN' ? 'navbar-admin bg-dark' : 'navbar-custom'}">
    <div class="container">
        <a class="navbar-brand fw-bold text-white d-flex align-items-center" href="/exams">
            <i class="fa-solid fa-graduation-cap me-2 fs-4 text-warning"></i>
            <span th:text="${user.role.name() == 'ADMIN' ? 'ES Admin Portal' : 'ESPP Platform'}">ESPP Platform</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <!-- Menu ADMIN -->
                <th:block th:if="${user.role.name() == 'ADMIN'}">
                    <li class="nav-item">
                        <a class="nav-link active fw-bold text-warning" href="/exams">
                            <i class="fa-solid fa-screwdriver-wrench me-1"></i> Quản lý Đề thi
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/questions">
                            <i class="fa-solid fa-circle-question me-1"></i> Quản lý Câu hỏi
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/support-tickets">
                            <i class="fa-solid fa-envelope me-1"></i> Hộp thư Hỗ trợ
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/histories">
                            <i class="fa-solid fa-clock-rotate-left me-1"></i> Lịch sử Thi
                        </a>
                    </li>
                </th:block>

                <!-- Menu STUDENT -->
                <th:block th:if="${user.role.name() == 'STUDENT'}">
                    <li class="nav-item">
                        <a class="nav-link active fw-semibold text-white" href="/exams">
                            <i class="fa-solid fa-book-open me-1"></i> Kho Đề Thi
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/student/support-tickets/user/{id}(id=${user.id})}">
                            <i class="fa-solid fa-circle-info me-1"></i> Gửi Hỗ Trợ
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/histories/user/{id}(id=${user.id})}">
                            <i class="fa-solid fa-clock-rotate-left me-1"></i> Lịch sử Học tập
                        </a>
                    </li>
                </th:block>
            </ul>

            <!-- Profile & Switcher -->
            <div class="d-flex align-items-center">
                <div class="me-3 text-light text-end d-none d-md-block">
                    <div class="fw-bold text-white small" th:text="${user.fullName}">Nguyen Van A</div>
                    <span class="badge bg-warning text-dark fw-bold px-2 py-1" th:text="${user.role}" style="font-size: 0.75rem;">STUDENT</span>
                </div>
                
                <div class="dropdown">
                    <button class="btn btn-outline-light btn-sm dropdown-toggle fw-bold" type="button" id="roleSwitcher" data-bs-toggle="dropdown">
                        <i class="fa-solid fa-user-gear me-1"></i> Chuyển Vai Trò
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                        <li><h6 class="dropdown-header">Chế độ kiểm thử (Mock)</h6></li>
                        <li><a class="dropdown-item" href="/exams?role=STUDENT"><i class="fa-solid fa-user me-2 text-primary"></i>Học viên (STUDENT)</a></li>
                        <li><a class="dropdown-item" href="/exams?role=ADMIN"><i class="fa-solid fa-user-shield me-2 text-danger"></i>Quản trị viên (ADMIN)</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- Fragment cho SCRIPTS -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</div>

</body>
</html>
