<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<!-- Fragment cho HEAD -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">ESPP Platform</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
            color: #333;
        }
        
        /* Layout & Sidebar CSS */
        #wrapper {
            display: flex;
            width: 100%;
            align-items: stretch;
        }
        
        #sidebar-wrapper {
            min-height: 100vh;
            width: 260px;
            background: #1e2229;
            color: #a3b1c6;
            transition: all 0.3s ease;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.05);
            z-index: 1000;
            flex-shrink: 0;
        }
        
        #sidebar-wrapper .sidebar-brand {
            padding: 1.5rem 1.25rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
        }
        
        #sidebar-wrapper .list-group {
            padding: 1rem 0;
        }
        
        #sidebar-wrapper .list-group-item {
            background-color: transparent;
            color: #a3b1c6;
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            border-radius: 8px;
            margin: 4px 10px;
            text-decoration: none;
        }
        
        #sidebar-wrapper .list-group-item i {
            margin-right: 12px;
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
            transition: transform 0.2s;
        }
        
        #sidebar-wrapper .list-group-item:hover {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.08);
        }
        
        #sidebar-wrapper .list-group-item:hover i {
            transform: scale(1.15);
        }
        
        #sidebar-wrapper .list-group-item.active {
            color: #fff;
            background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
            box-shadow: 0 4px 12px rgba(42, 82, 152, 0.3);
        }
        
        #page-content-wrapper {
            flex-grow: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Responsive Sidebar toggling */
        @media (max-width: 768px) {
            #sidebar-wrapper {
                margin-left: -260px;
            }
            #wrapper.toggled #sidebar-wrapper {
                margin-left: 0;
            }
        }
        @media (min-width: 769px) {
            #wrapper.toggled #sidebar-wrapper {
                margin-left: -260px;
            }
        }
        
        /* Navbar custom styles */
        .navbar-custom {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }
        .navbar-admin {
            background: #212529 !important;
        }
        
        /* Content Styling */
        .page-header {
            background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
            color: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .exam-card {
            border: none;
            border-radius: 12px;
            background-color: #ffffff;
            transition: all 0.3s ease-in-out;
        }
        .exam-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.08) !important;
        }
        .icon-box {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }
        .icon-box-student {
            background-color: rgba(42, 82, 152, 0.1);
            color: #2a5298;
        }
        .icon-box-admin {
            background-color: rgba(255, 193, 7, 0.1);
            color: #ffc107;
        }
        .badge-type {
            font-weight: 600;
        }
        .btn-action {
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
        }
    </style>
</head>
<body>

<!-- Fragment cho NAVBAR chung -->
<nav th:fragment="navbar(user)" class="navbar navbar-expand-lg navbar-dark shadow-sm mb-4" 
     th:classappend="${user.role.name() == 'ADMIN' ? 'navbar-admin bg-dark' : 'navbar-custom'}">
    <div class="container-fluid px-4">
        <!-- Menu Toggle Button -->
        <button class="btn btn-outline-light me-3" id="menu-toggle">
            <i class="fa-solid fa-bars"></i>
        </button>
        
        <a class="navbar-brand fw-bold text-white d-flex align-items-center" href="/exams">
            <i class="fa-solid fa-graduation-cap me-2 fs-4 text-warning"></i>
            <span th:text="${user.role.name() == 'ADMIN' ? 'ES Admin Portal' : 'ESPP Platform'}">ESPP Platform</span>
        </a>
        
        <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarNav">
            <!-- Profile (Align right) -->
            <div class="d-flex align-items-center ms-auto">
                <div class="text-light text-end me-3">
                    <div class="fw-bold text-white small" th:text="${user.fullName}">Nguyen Van A</div>
                    <span class="badge bg-warning text-dark fw-bold px-2 py-1" th:text="${user.role}" style="font-size: 0.75rem;">STUDENT</span>
                </div>
                <!-- Logout form -->
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<!-- Fragment cho SIDEBAR chung -->
<div th:fragment="sidebar(user, activeMenu)" id="sidebar-wrapper">
    <div class="sidebar-brand">
        <i class="fa-solid fa-shield-halved text-warning me-2"></i>
        <span>Menu Chức Năng</span>
    </div>
    <div class="list-group list-group-flush">
        <!-- Sidebar Menu ADMIN -->
        <th:block th:if="${user.role.name() == 'ADMIN'}">
            <a class="list-group-item" th:classappend="${activeMenu == 'exams' ? 'active' : ''}" href="/exams">
                <i class="fa-solid fa-screwdriver-wrench"></i> Quản lý Đề thi
            </a>
            <a class="list-group-item" th:classappend="${activeMenu == 'questions' ? 'active' : ''}" href="/admin/questions">
                <i class="fa-solid fa-circle-question"></i> Quản lý Câu hỏi
            </a>
            <a class="list-group-item" th:classappend="${activeMenu == 'support' ? 'active' : ''}" href="/admin/support-tickets">
                <i class="fa-solid fa-envelope"></i> Hộp thư Hỗ trợ
            </a>
            <a class="list-group-item" th:classappend="${activeMenu == 'histories' ? 'active' : ''}" href="/admin/histories">
                <i class="fa-solid fa-clock-rotate-left"></i> Lịch sử Thi
            </a>
        </th:block>

        <!-- Sidebar Menu STUDENT -->
        <th:block th:if="${user.role.name() == 'STUDENT'}">
            <a class="list-group-item" th:classappend="${activeMenu == 'exams' ? 'active' : ''}" href="/exams">
                <i class="fa-solid fa-book-open"></i> Kho Đề Thi
            </a>
            <a class="list-group-item" th:classappend="${activeMenu == 'support' ? 'active' : ''}" th:href="@{/student/support-tickets/user/{id}(id=${user.id})}">
                <i class="fa-solid fa-circle-info"></i> Gửi Hỗ Trợ
            </a>
            <a class="list-group-item" th:classappend="${activeMenu == 'histories' ? 'active' : ''}" th:href="@{/histories/user/{id}(id=${user.id})}">
                <i class="fa-solid fa-clock-rotate-left"></i> Lịch sử Học tập
            </a>
        </th:block>
    </div>
</div>

<!-- Fragment cho FOOTER chung -->
<footer th:fragment="footer" class="bg-white text-center py-4 border-top mt-auto shadow-sm">
    <div class="container">
        <p class="text-muted mb-0">&copy; 2026 ESPP Platform. All rights reserved.</p>
    </div>
</footer>

<!-- Fragment cho SCRIPTS -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const toggleBtn = document.getElementById("menu-toggle");
            if (toggleBtn) {
                toggleBtn.addEventListener("click", function(e) {
                    e.preventDefault();
                    document.getElementById("wrapper").classList.toggle("toggled");
                });
            }
        });
    </script>
</div>

</body>
</html>
