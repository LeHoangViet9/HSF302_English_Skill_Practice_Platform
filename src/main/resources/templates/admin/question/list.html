<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Quản lý Câu hỏi - Admin')}"></head>
<body class="bg-light">
<div id="wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar(${user}, 'questions')}"></div>

    <!-- Page Content -->
    <div id="page-content-wrapper" class="d-flex flex-column">
        <!-- Navbar -->
        <nav th:replace="~{fragments/layout :: navbar(${user})}"></nav>

        <div class="container-fluid my-4 flex-grow-1 px-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold text-dark">Danh Sách Câu Hỏi</h3>
                    <p class="text-muted mb-0">Quản lý ngân hàng câu hỏi theo kỹ năng của hệ thống</p>
                </div>
                <div>
                    <a href="/exams" class="btn btn-outline-secondary fw-bold me-2">
                        <i class="fa-solid fa-chevron-left me-1"></i> Quay về Đề thi
                    </a>
                    <a href="/admin/questions/create" class="btn btn-primary fw-bold">
                        <i class="fa-solid fa-plus me-1"></i> Thêm Câu Hỏi Mới
                    </a>
                </div>
            </div>

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
                <i class="fa-solid fa-circle-check me-2"></i> <span th:text="${successMessage}">Thao tác thành công!</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Bộ lọc câu hỏi đơn giản -->
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body p-3">
                    <form th:action="@{/admin/questions}" method="get" class="row g-2 align-items-center">
                        <div class="col-md-3">
                            <input type="number" name="examId" class="form-control" placeholder="Mã đề thi (Exam ID)..." th:value="${param.examId}">
                        </div>
                        <div class="col-md-3">
                            <select name="skill" class="form-select">
                                <option value="">-- Tất cả kỹ năng --</option>
                                <option value="LISTENING" th:selected="${param.skill != null && param.skill[0] == 'LISTENING'}">Nghe (LISTENING)</option>
                                <option value="READING" th:selected="${param.skill != null && param.skill[0] == 'READING'}">Đọc (READING)</option>
                                <option value="SPEAKING" th:selected="${param.skill != null && param.skill[0] == 'SPEAKING'}">Nói (SPEAKING)</option>
                                <option value="WRITING" th:selected="${param.skill != null && param.skill[0] == 'WRITING'}">Viết (WRITING)</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-dark w-100"><i class="fa-solid fa-filter me-1"></i> Lọc</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-secondary text-dark">
                            <tr>
                                <th scope="col" class="ps-4 py-3" style="width: 5%;">ID</th>
                                <th scope="col" class="py-3" style="width: 15%;">Kỹ năng</th>
                                <th scope="col" class="py-3" style="width: 40%;">Nội dung câu hỏi</th>
                                <th scope="col" class="py-3 text-center" style="width: 20%;">Đáp án đúng</th>
                                <th scope="col" class="pe-4 py-3 text-center" style="width: 20%;">Thao tác</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${questions == null || questions.isEmpty()}">
                                <td colspan="5" class="text-center py-5 text-muted">Không tìm thấy câu hỏi nào.</td>
                            </tr>
                            <tr th:each="q : ${questions}">
                                <td class="ps-4 fw-bold" th:text="${q.id}">1</td>
                                <td>
                                    <span class="badge px-3 py-2 fw-semibold rounded-pill"
                                          th:classappend="${q.skill.name() == 'LISTENING' ? 'bg-primary' :
                                                           q.skill.name() == 'READING' ? 'bg-success' :
                                                           q.skill.name() == 'SPEAKING' ? 'bg-danger' : 'bg-warning text-dark'}"
                                          th:text="${q.skill}">READING</span>
                                </td>
                                <td>
                                    <div class="fw-bold text-dark text-truncate" style="max-width: 350px;" th:text="${q.questionText}">Nội dung câu hỏi</div>
                                    <small th:if="${q.audioUrl != null && !q.audioUrl.isBlank()}" class="text-primary">
                                        <i class="fa-solid fa-music me-1"></i> Audio: Yes
                                    </small>
                                    <div th:if="${q.options != null && !q.options.isEmpty()}" class="mt-1">
                                        <small class="text-muted d-block" th:each="opt : ${q.options}">
                                            <strong th:text="${opt.key} + ': '">A:</strong> <span th:text="${opt.value}">Lựa chọn</span>
                                        </small>
                                    </div>
                                </td>
                                <td class="text-center fw-bold text-primary" th:text="${q.correctAnswer}">A</td>
                                <td class="pe-4 text-center">
                                    <div class="btn-group" role="group">
                                        <a th:href="@{/admin/questions/{id}/edit(id=${q.id})}" class="btn btn-sm btn-outline-primary" title="Chỉnh sửa">
                                            <i class="fa-solid fa-pen-to-square"></i>
                                        </a>
                                        <form th:action="@{/admin/questions/{id}/delete(id=${q.id})}" method="post" class="d-inline"
                                              onsubmit="return confirm('Bạn có chắc chắn muốn xóa câu hỏi này không?')">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa">
                                                <i class="fa-solid fa-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
