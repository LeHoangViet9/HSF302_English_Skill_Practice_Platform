<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head th:replace="~{fragments/layout :: head('Duyệt Nội Dung - Admin')}">
    <title>Duyệt Nội Dung</title>
</head>

<body class="apple-theme">
    <div id="wrapper">
        <!-- Sidebar -->
        <div th:replace="~{fragments/layout :: sidebar(${user}, 'approvals')}"></div>

        <!-- Page Content -->
        <div id="page-content-wrapper" class="d-flex flex-column">
            <!-- Navbar -->
            <nav th:replace="~{fragments/layout :: navbar(${user})}"></nav>

            <div class="container-fluid my-4 flex-grow-1 px-4">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="text-primary fw-bold m-0"><i class="fas fa-check-double me-2"></i>Duyệt Nội Dung</h2>
                </div>

                <!-- Alert Messages -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm"
                    role="alert">
                    <i class="fas fa-check-circle me-2"></i><span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Nav tabs -->
                <ul class="nav nav-tabs mb-4" id="approvalTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="lessons-tab" data-bs-toggle="tab" data-bs-target="#lessons"
                            type="button" role="tab">
                            Bài Học Chờ Duyệt <span class="badge bg-danger ms-1"
                                th:text="${lessonPage.totalElements}">0</span>
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="exams-tab" data-bs-toggle="tab" data-bs-target="#exams"
                            type="button" role="tab">
                            Đề Thi Chờ Duyệt <span class="badge bg-danger ms-1"
                                th:text="${examPage.totalElements}">0</span>
                        </button>
                    </li>
                </ul>

                <!-- Tab panes -->
                <div class="tab-content" id="approvalTabsContent">

                    <!-- Lessons Tab -->
                    <div class="tab-pane fade show active" id="lessons" role="tabpanel">
                        <div class="card shadow-sm border-0">
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle mb-0">
                                        <thead class="table-light">
                                            <tr>
                                                <th>ID</th>
                                                <th>Tiêu đề</th>
                                                <th>Người tạo</th>
                                                <th>Ngày tạo</th>
                                                <th>Hành động</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="lesson : ${lessonPage.content}">
                                                <td th:text="${lesson.id}"></td>
                                                <td class="fw-bold" th:text="${lesson.title}"></td>
                                                <td th:text="${lesson.createdByName != null ? lesson.createdByName : 'N/A'}"></td>
                                                <td th:text="${#temporals.format(lesson.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                                                <td>
                                                    <form
                                                        th:action="@{/admin/approvals/lessons/{id}/approve(id=${lesson.id})}"
                                                        method="post" class="d-inline">
                                                        <button type="submit" class="btn btn-sm btn-success"
                                                            title="Duyệt bài">
                                                            <i class="fas fa-check"></i> Duyệt
                                                        </button>
                                                    </form>
                                                    <button type="button" class="btn btn-sm btn-danger ms-1"
                                                        data-bs-toggle="modal"
                                                        th:data-bs-target="'#rejectLessonModal' + ${lesson.id}"
                                                        title="Từ chối">
                                                        <i class="fas fa-times"></i> Từ chối
                                                    </button>

                                                    <!-- Modal Từ chối Lesson -->
                                                    <div class="modal fade" th:id="'rejectLessonModal' + ${lesson.id}"
                                                        tabindex="-1">
                                                        <div class="modal-dialog">
                                                            <div class="modal-content">
                                                                <form
                                                                    th:action="@{/admin/approvals/lessons/{id}/reject(id=${lesson.id})}"
                                                                    method="post">
                                                                    <div class="modal-header">
                                                                        <h5 class="modal-title text-danger">Từ chối bài
                                                                            học</h5>
                                                                        <button type="button" class="btn-close"
                                                                            data-bs-dismiss="modal"></button>
                                                                    </div>
                                                                    <div class="modal-body">
                                                                        <p>Lý do từ chối bài học: <strong
                                                                                th:text="${lesson.title}"></strong></p>
                                                                        <label>
                                                                            <textarea name="reason" class="form-control"
                                                                                rows="3" required
                                                                                placeholder="Nhập lý do..."></textarea>
                                                                        </label>
                                                                    </div>
                                                                    <div class="modal-footer">
                                                                        <button type="button" class="btn btn-secondary"
                                                                            data-bs-dismiss="modal">Hủy</button>
                                                                        <button type="submit" class="btn btn-danger">Xác
                                                                            nhận Từ chối</button>
                                                                    </div>
                                                                </form>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </td>
                                            </tr>
                                            <tr th:if="${lessonPage.empty}">
                                                <td colspan="5" class="text-center py-4 text-muted">Không có bài học nào
                                                    đang chờ duyệt.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <div class="mt-4" th:if="${lessonPage.totalPages > 1}">
                            <!-- Phân trang bài học nếu cần -->
                        </div>
                    </div>

                    <!-- Exams Tab -->
                    <div class="tab-pane fade" id="exams" role="tabpanel">
                        <div class="card shadow-sm border-0">
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle mb-0">
                                        <thead class="table-light">
                                            <tr>
                                                <th>ID</th>
                                                <th>Tiêu đề đề thi</th>
                                                <th>Loại</th>
                                                <th>Hành động</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="exam : ${examPage.content}">
                                                <td th:text="${exam.id}"></td>
                                                <td class="fw-bold" th:text="${exam.title}"></td>
                                                <td>
                                                    <span class="badge bg-info text-dark"
                                                        th:text="${exam.type.name()}"></span>
                                                </td>
                                                <td>
                                                    <form
                                                        th:action="@{/admin/approvals/exams/{id}/approve(id=${exam.id})}"
                                                        method="post" class="d-inline">
                                                        <button type="submit" class="btn btn-sm btn-success"
                                                            title="Duyệt đề thi">
                                                            <i class="fas fa-check"></i> Duyệt
                                                        </button>
                                                    </form>
                                                    <button type="button" class="btn btn-sm btn-danger ms-1"
                                                        data-bs-toggle="modal"
                                                        th:data-bs-target="'#rejectExamModal' + ${exam.id}"
                                                        title="Từ chối">
                                                        <i class="fas fa-times"></i> Từ chối
                                                    </button>

                                                    <!-- Modal Từ chối Exam -->
                                                    <div class="modal fade" th:id="'rejectExamModal' + ${exam.id}"
                                                        tabindex="-1">
                                                        <div class="modal-dialog">
                                                            <div class="modal-content">
                                                                <form
                                                                    th:action="@{/admin/approvals/exams/{id}/reject(id=${exam.id})}"
                                                                    method="post">
                                                                    <div class="modal-header">
                                                                        <h5 class="modal-title text-danger">Từ chối đề
                                                                            thi</h5>
                                                                        <button type="button" class="btn-close"
                                                                            data-bs-dismiss="modal"></button>
                                                                    </div>
                                                                    <div class="modal-body">
                                                                        <p>Lý do từ chối đề thi: <strong
                                                                                th:text="${exam.title}"></strong></p>
                                                                        <label>
                                                                            <textarea name="reason" class="form-control"
                                                                                rows="3" required
                                                                                placeholder="Nhập lý do..."></textarea>
                                                                        </label>
                                                                    </div>
                                                                    <div class="modal-footer">
                                                                        <button type="button" class="btn btn-secondary"
                                                                            data-bs-dismiss="modal">Hủy</button>
                                                                        <button type="submit" class="btn btn-danger">Xác
                                                                            nhận Từ chối</button>
                                                                    </div>
                                                                </form>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </td>
                                            </tr>
                                            <tr th:if="${examPage.empty}">
                                                <td colspan="4" class="text-center py-4 text-muted">Không có đề thi nào
                                                    đang chờ duyệt.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Footer -->
            <footer th:replace="~{fragments/layout :: footer}"></footer>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>
