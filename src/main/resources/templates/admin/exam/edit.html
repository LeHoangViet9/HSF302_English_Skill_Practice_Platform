<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Chỉnh Sửa Đề Thi - Admin')}"><title>Chỉnh sử đề thi</title></head>
<body class="apple-theme">
<div id="wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar(${user}, 'exams')}"></div>

    <!-- Page Content -->
    <div id="page-content-wrapper" class="d-flex flex-column">
        <!-- Navbar -->
        <nav th:replace="~{fragments/layout :: navbar(${user})}"></nav>

        <div class="container-fluid my-4 flex-grow-1 px-4 d-flex justify-content-center">
            <div class="apple-store-utility-card p-4" style="max-width: 700px; width: 100%; height: fit-content;">
                <!-- Header -->
                <div style="border-bottom: 1px solid var(--apple-hairline); padding-bottom: 16px; margin-bottom: 24px;">
                    <h4 class="apple-tagline mb-0" style="font-size: 21px; display: flex; align-items: center; gap: 8px;">
                        <i class="fa-solid fa-pen-to-square text-primary"></i> Chỉnh Sửa Đề Thi
                    </h4>
                </div>

                <!-- Form -->
                <form th:action="@{/manage/exams/{id}/update(id=${exam.id})}" th:object="${exam}" method="post">
                    
                    <!-- Hiển thị lỗi chung -->
                    <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger border-0 shadow-none mb-4" 
                         style="background-color: #fce8e6; border: 1px solid #fad2cf !important; color: #c5221f; border-radius: var(--apple-rounded-md);" role="alert">
                        <i class="fa-solid fa-triangle-exclamation me-2"></i> Vui lòng kiểm tra lại các thông tin nhập liệu bên dưới.
                    </div>

                    <div class="mb-3">
                        <label for="title" class="apple-caption-strong" style="color: var(--apple-ink); margin-bottom: 6px; display: block;">
                            Tên đề thi <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="apple-text-field" id="title" th:field="*{title}" placeholder="Ví dụ: Đề thi thử Tiếng Anh B1 - Đề số 3" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Tên đề thi không hợp lệ</div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="type" class="apple-caption-strong" style="color: var(--apple-ink); margin-bottom: 6px; display: block;">
                                Loại đề thi <span class="text-danger">*</span>
                            </label>
                            <select class="apple-text-field" style="height: 48px; padding: 0 16px; font-size: 15px;" id="type" th:field="*{type}" required>
                                <option value="MOCK_TEST">MOCK_TEST (Thi thử)</option>
                                <option value="QUIZ">QUIZ (Trắc nghiệm nhanh)</option>
                            </select>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('type')}" th:errors="*{type}">Loại không hợp lệ</div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="duration" class="apple-caption-strong" style="color: var(--apple-ink); margin-bottom: 6px; display: block;">
                                Thời gian thi (phút) <span class="text-danger">*</span>
                            </label>
                            <input type="number" class="apple-text-field" id="duration" th:field="*{duration}" min="1" max="180" placeholder="20" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('duration')}" th:errors="*{duration}">Thời gian không hợp lệ</div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="totalQuestions" class="apple-caption-strong" style="color: var(--apple-ink); margin-bottom: 6px; display: block;">
                            Số lượng câu hỏi <span class="text-danger">*</span>
                        </label>
                        <input type="number" class="apple-text-field" id="totalQuestions" th:field="*{totalQuestions}" min="1" max="200" placeholder="4" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('totalQuestions')}" th:errors="*{totalQuestions}">Số câu hỏi không hợp lệ</div>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="apple-caption-strong" style="color: var(--apple-ink); margin-bottom: 6px; display: block;">
                            Mô tả đề thi <span class="text-danger">*</span>
                        </label>
                        <textarea class="apple-text-field" id="description" th:field="*{description}" rows="4" style="height: auto;" placeholder="Mô tả tóm tắt nội dung bài thi và mục tiêu rèn luyện..." required></textarea>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Mô tả không hợp lệ</div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="/exams" class="btn-apple btn-apple-secondary-pill" style="font-size: 14px; padding: 10px 20px;">Hủy bỏ</a>
                        <button type="submit" class="btn-apple btn-apple-primary btn-action" style="font-size: 14px; padding: 10px 20px;">
                            <i class="fa-solid fa-save me-1"></i> Lưu Đề Thi
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Footer -->
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
