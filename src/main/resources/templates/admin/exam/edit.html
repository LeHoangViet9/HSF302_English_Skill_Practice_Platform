<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh Sửa Đề Thi - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-warning" href="/exams"><i class="fa-solid fa-screwdriver-wrench me-2"></i> ES Admin Portal</a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active fw-bold" href="/exams">Quản lý Đề thi</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/questions">Quản lý Câu hỏi</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/support-tickets">Hộp thư Hỗ trợ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/histories">Lịch sử Thi</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5" style="max-width: 700px;">
    <div class="card shadow border-0">
        <div class="card-header bg-warning text-dark py-3">
            <h4 class="mb-0 fw-bold"><i class="fa-solid fa-pen-to-square me-2"></i> Chỉnh Sửa Đề Thi</h4>
        </div>
        <div class="card-body p-4">

            <form th:action="@{/admin/exams/{id}/update(id=${exam.id})}" th:object="${exam}" method="post">

                <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger mb-4 shadow-sm" role="alert">
                    <i class="fa-solid fa-triangle-exclamation me-2"></i> Vui lòng kiểm tra lại các thông tin nhập liệu bên dưới.
                </div>

                <div class="mb-3">
                    <label for="title" class="form-label fw-bold text-secondary">Tên đề thi <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="title" th:field="*{title}" required>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Tên đề thi không hợp lệ</div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="type" class="form-label fw-bold text-secondary">Loại đề thi <span class="text-danger">*</span></label>
                        <select class="form-select" id="type" th:field="*{type}" required>
                            <option value="MOCK_TEST">MOCK_TEST (Thi thử)</option>
                            <option value="QUIZ">QUIZ (Trắc nghiệm nhanh)</option>
                        </select>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('type')}" th:errors="*{type}">Loại không hợp lệ</div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="duration" class="form-label fw-bold text-secondary">Thời gian thi (phút) <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="duration" th:field="*{duration}" min="1" max="180" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('duration')}" th:errors="*{duration}">Thời gian không hợp lệ</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="totalQuestions" class="form-label fw-bold text-secondary">Số lượng câu hỏi <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" id="totalQuestions" th:field="*{totalQuestions}" min="1" max="200" required>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('totalQuestions')}" th:errors="*{totalQuestions}">Số câu hỏi không hợp lệ</div>
                </div>

                <div class="mb-4">
                    <label for="description" class="form-label fw-bold text-secondary">Mô tả đề thi <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="description" th:field="*{description}" rows="4" required></textarea>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Mô tả không hợp lệ</div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="/exams" class="btn btn-outline-secondary px-4">Hủy bỏ</a>
                    <button type="submit" class="btn btn-warning px-4 fw-bold">
                        <i class="fa-solid fa-save me-1"></i> Cập Nhật Đề Thi
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
